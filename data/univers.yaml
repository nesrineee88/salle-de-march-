# Univers du simulateur : une seule source (Yahoo Finance via yfinance), figée en instantané.
# Voir docs/DECISIONS.md (D2, D3, D8). Modifier ce fichier puis relancer le pipeline.

fenetre:
  debut: 2018-01-01        # début de la simulation
  fin: 2026-10-30          # fin de la simulation : dernier vendredi avant le téléchargement (jeu de données figé).
                           # Pour aller plus loin, changer cette date puis relancer : python -m pipeline tout
                           # (les actualités du jeu FNSPID s'arrêtent en 2023 ; après, seuls les repères et les actualités fictives existent)
  historique_prealable_jours: 400   # historique avant le début, pour les indicateurs (SMA200, etc.)

# Heures de séance approximatives en UTC (l'heure d'été est ignorée). Hors séance, le prix reste figé.
# Les classes absentes de cette liste cotent sur toute la journée (cryptos 24h/24 ; futures quasi 24h).
sessions_utc:
  action: ["14:30", "21:00"]

actifs:

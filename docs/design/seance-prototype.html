<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance, identité et prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20x%3D%228%22%20y%3D%226%22%20width%3D%229%22%20height%3D%2236%22%20rx%3D%222%22%20fill%3D%22%233BE3EA%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2213%22%20width%3D%229%22%20height%3D%2222%22%20rx%3D%222%22%20fill%3D%22%2318C3B8%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%2219.5%22%20width%3D%229%22%20height%3D%229%22%20rx%3D%222%22%20fill%3D%22%230E8F98%22%2F%3E%3C%2Fsvg%3E">
<!-- Prototype autonome : données fictives, aucun appel au backend ni au réseau. -->
<style>
/* SÉANCE — direction « nuit de séance » : une salle obscure (navy), un faisceau (cyan),
   une pellicule du temps en pied d'écran où l'avenir reste hachuré.
   Mise en page : rail fin | espace de travail | pellicule. */
:root{
  color-scheme:dark;
  --navy-950:#040B16;--navy-900:#071222;--navy-850:#0A182B;--navy-800:#0E2036;--navy-700:#142B46;--navy-600:#1E3A5A;
  --trait:#162B45;--trait-2:#27466A;
  --encre:#EDF5FB;--encre-2:#A9BDD1;--encre-3:#8399B2;
  --cyan:#3BE3EA;--turquoise:#18C3B8;--cyan-voile:rgba(59,227,234,.11);--sur-cyan:#03202A;
  --gain:#4FD1B0;--perte:#FF8580;--alerte:#F2C46D;
  --m-gain:#2FA58A;--m-perte:#E5625E;
  --s1:#0FA3B1;--s2:#8B7CF0;--s3:#B98A14;--s4:#D9578B;--s5:#4C86E8;--neutre:#5F7690;
  --titre:"Bricolage",system-ui,sans-serif;--texte:"Plex",system-ui,sans-serif;
  --e1:4px;--e2:8px;--e3:12px;--e4:16px;--e5:24px;--e6:32px;
  --r1:6px;--r2:10px;--r3:16px;--rail:80px;--haut:60px;--film:54px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--navy-950);color:var(--encre);font:14px/1.45 var(--texte);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3,h4{font-family:var(--titre);font-weight:620;line-height:1.15;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.42;cursor:not-allowed}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::selection{background:var(--cyan);color:var(--sur-cyan)}
*{scrollbar-width:thin;scrollbar-color:var(--navy-600) transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.up{color:var(--gain)}.dn{color:var(--perte)}.dim{color:var(--encre-3)}.d2{color:var(--encre-2)}.r{text-align:right}

/* composants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--e2);min-height:38px;padding:0 var(--e4);border:1px solid var(--trait-2);border-radius:var(--r1);font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--navy-700);border-color:var(--encre-3)}
.btn.p{background:var(--cyan);color:var(--sur-cyan);border-color:var(--cyan)}
.btn.p:hover:not(:disabled){background:#7CF0F4;border-color:#7CF0F4}
.btn.v{background:var(--perte);color:#2A0808;border-color:var(--perte)}
.btn.v:hover:not(:disabled){background:#FFA5A1;border-color:#FFA5A1}
.btn.mini{min-height:30px;padding:0 10px;font-size:12px}
.btn.large{width:100%;min-height:44px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border-radius:var(--r1);color:var(--encre-2)}
.ib:hover{background:var(--navy-700);color:var(--encre)}
.ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg button{min-height:30px;padding:0 10px;border-radius:var(--r1);color:var(--encre-2);font-size:12px;font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--encre);background:var(--navy-800)}
.seg button[aria-pressed=true]{color:var(--cyan);background:var(--cyan-voile)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:var(--r1);background:var(--navy-700);color:var(--encre-2);font-size:11px;font-weight:600;white-space:nowrap}
.tag.c{background:var(--cyan-voile);color:var(--cyan)}
.tag.g{background:rgba(79,209,176,.12);color:var(--gain)}
.tag.l{background:rgba(255,133,128,.12);color:var(--perte)}
.tag.w{background:rgba(242,196,109,.12);color:var(--alerte)}
.field{display:grid;gap:5px;font-size:12px;color:var(--encre-2)}
.input{width:100%;min-width:0;height:38px;padding:0 10px;background:var(--navy-950);border:1px solid var(--trait-2);border-radius:var(--r1);color:var(--encre)}
.input:hover{border-color:var(--encre-3)}
input[type=range]{appearance:none;width:100%;height:20px;margin:6px 0;background:linear-gradient(var(--navy-600),var(--navy-600)) center/100% 4px no-repeat;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--cyan);border:3px solid var(--navy-900);box-shadow:0 0 0 1px var(--cyan)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cyan);border:0}
input[type=checkbox]{appearance:none;display:grid;place-items:center;width:16px;height:16px;margin:0;border:1px solid var(--trait-2);border-radius:4px;background:var(--navy-950);cursor:pointer}
input[type=checkbox]:checked{background:var(--cyan);border-color:var(--cyan)}
input[type=checkbox]:checked:after{content:"✓";color:var(--sur-cyan);font-size:12px;line-height:1}
.info{display:inline-grid;place-items:center;width:17px;height:17px;border:1px solid var(--trait-2);border-radius:50%;color:var(--encre-3);font-size:10px;line-height:1;vertical-align:middle;margin-left:4px}
.info:hover{color:var(--cyan);border-color:var(--cyan)}
.aide{color:var(--encre-3);font-size:12px;max-width:68ch}
body.trader .aide{display:none}
.note{padding:10px 12px;border-radius:var(--r1);background:rgba(242,196,109,.08);color:var(--alerte);font-size:12px}
.note.calme{background:var(--cyan-voile);color:var(--encre)}
.panel{min-width:0;background:var(--navy-900);border:1px solid var(--trait);border-radius:var(--r2)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:var(--e2);flex-wrap:wrap;min-height:48px;padding:8px var(--e4)}
.ph h2,.ph h3{font-size:15px}
.pb{padding:0 var(--e4) var(--e4)}
.vide{display:grid;place-items:center;gap:var(--e2);padding:var(--e5);color:var(--encre-3);text-align:center}
.key{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--encre-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:3px;border-radius:2px;background:var(--c)}.key i.sw{width:9px;height:9px;border-radius:50%}
.sw{display:inline-block;width:8px;height:8px;flex:none;border-radius:2px;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;z-index:1;background:var(--navy-900);color:var(--encre-3);font-size:11px;font-weight:400;text-align:right;white-space:nowrap}
th button{color:inherit}
th button:hover{color:var(--cyan)}
th,td{padding:8px 10px}
td{border-top:1px solid var(--trait);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:var(--e4)}
th:last-child,td:last-child{padding-right:var(--e4)}
tbody tr:hover td{background:var(--navy-850)}
.scroll{overflow:auto;min-width:0;min-height:0;position:relative}
.asset{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.asset b{display:block;line-height:1.2}
.asset small{display:block;color:var(--encre-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:var(--r1);background:var(--navy-700);color:var(--cyan);font:700 12px var(--titre)}

/* coquille */
#app{display:grid;grid-template:var(--haut) minmax(0,1fr) var(--film)/var(--rail) minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.rail{grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-right:1px solid var(--trait);background:var(--navy-950)}
.rail>.logo{margin:2px 0 18px}
.rail>.logo svg{width:38px;height:38px}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;min-height:58px;border-radius:var(--r2);color:var(--encre-3);font-size:10.5px}
.nav .ic{width:21px;height:21px}
.nav:hover{color:var(--encre);background:var(--navy-900)}
.nav[aria-current=page]{color:var(--cyan);background:var(--cyan-voile)}
.rail .bas{margin-top:auto}
.top{display:flex;align-items:center;gap:var(--e4);padding:0 var(--e5);border-bottom:1px solid var(--trait);min-width:0}
.word{font:700 20px var(--titre);letter-spacing:.01em}
.word i{color:var(--cyan);font-style:normal}
.search{display:flex;align-items:center;gap:10px;width:min(330px,30vw);height:38px;padding:0 12px;border-radius:var(--r1);background:var(--navy-900);color:var(--encre-3);text-align:left}
.search:hover{background:var(--navy-800)}
.search span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
kbd{padding:2px 6px;border:1px solid var(--trait-2);border-radius:4px;color:var(--encre-3);font:11px var(--texte)}
.top .fin{display:flex;align-items:center;gap:var(--e3);margin-left:auto}
.solde{text-align:right;line-height:1.2}
.solde small{display:block;color:var(--encre-3);font-size:11px}
.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--turquoise));color:var(--sur-cyan);font-weight:600}
main{min-width:0;min-height:0;overflow:auto;position:relative}
.film{display:flex;align-items:center;gap:var(--e3);padding:0 var(--e4);border-top:1px solid var(--trait);background:var(--navy-900);min-width:0}
.play{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:var(--cyan);color:var(--sur-cyan)}
.play .ic{fill:currentColor;stroke:none;width:17px;height:17px}
.fdate{min-width:128px;line-height:1.2}
.fdate b{display:block;font-size:13px}
.fdate small{color:var(--encre-3);font-size:10.5px}
.bobine{position:relative;flex:1;height:30px;min-width:40px;overflow:hidden;border-radius:4px;background:var(--navy-950)}
.bobine svg{width:100%;height:100%}
.bobine .futur{position:absolute;top:0;bottom:0;right:0;border-left:2px solid var(--cyan);background:repeating-linear-gradient(115deg,var(--navy-900) 0 5px,var(--navy-800) 5px 7px);display:flex;align-items:center;justify-content:center;color:var(--encre-3);font-size:10.5px;white-space:nowrap}

/* pages */
.page{max-width:1500px;margin:auto;padding:var(--e5);display:grid;gap:var(--e4)}
.titre{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--e3);flex-wrap:wrap}
.titre h1{font-size:25px}
.titre p{color:var(--encre-2);margin-top:4px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--e4);align-items:stretch}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.plot{position:relative;width:100%;min-width:0;touch-action:pan-y}
.plot>svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.plot text{font:11px var(--texte);fill:var(--encre-3)}
.plot text.fort{fill:var(--encre);font-weight:600}
.plot text.sur{fill:var(--sur-cyan);font-weight:600}
.viseur{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--encre-3);pointer-events:none}
.bulle{position:absolute;z-index:3;top:8px;min-width:150px;padding:8px 10px;border:1px solid var(--trait-2);border-radius:var(--r1);background:var(--navy-800);font-size:12px;pointer-events:none}
.bulle b{display:block;margin-bottom:4px}
.bulle p{display:flex;justify-content:space-between;gap:14px;color:var(--encre-2)}
.bulle p span:last-child{color:var(--encre)}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);overflow:hidden;background:linear-gradient(105deg,var(--navy-800),var(--navy-900) 60%)}
.hero .recit{display:flex;flex-direction:column;gap:var(--e3);padding:var(--e5)}
.hv{font:640 42px/1 var(--titre);white-space:nowrap}
.hv small{font:400 13px var(--texte);color:var(--encre-3);margin-left:6px}
.phrase{font-size:15px;color:var(--encre-2)}
.phrase b{color:var(--encre)}
.hero .acts{display:flex;gap:var(--e2);flex-wrap:wrap;margin-top:auto}
.hero .courbe{display:flex;flex-direction:column;padding:var(--e3) var(--e2) var(--e2) 0;min-width:0}
.hero .plot{flex:1;min-height:220px}
.faits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--trait)}
.fait{min-width:0;padding:12px var(--e4);border-left:1px solid var(--trait)}
.fait:first-child{border-left:0}
.fait small{display:block;color:var(--encre-3);font-size:12px}
.fait strong{display:inline-block;font:620 21px var(--titre);margin-top:3px;white-space:nowrap}
.fait em{display:block;font-style:normal;color:var(--encre-2);font-size:12px}
.lignes>*{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:8px 0;border-top:1px solid var(--trait);text-align:left}
.lignes>:first-child{border-top:0}
.alloc{display:flex;gap:2px;height:14px;margin:8px 0 12px}
.alloc i{min-width:2px;background:var(--c);border-radius:2px}
.legl p{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.legl p span:nth-child(2){flex:1;color:var(--encre-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jauge{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:8px 0}
.jauge i{height:7px;border-radius:3px;background:var(--navy-700)}
.jauge i.on{background:var(--c)}

/* salle de marché */
.desk{height:100%;min-height:500px;display:grid;grid-template-columns:232px minmax(340px,1fr) 224px 276px;grid-template-rows:minmax(0,1fr) auto}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--trait)}
.desk>.watch{grid-row:1/3}.desk>.centre{grid-row:1}.desk>.book{grid-row:1}.desk>.ticket{grid-row:1/3;border:0;overflow:auto}
.desk>.blotter{grid-column:2/4;grid-row:2;height:164px;border-top:1px solid var(--trait)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;min-height:44px;padding:4px 12px}
.mh h2{font-size:14px;white-space:nowrap}
.watch .input{height:32px}
.watch .filtres{padding:0 8px 8px}
.watch .filtres{flex-wrap:nowrap;justify-content:space-between;gap:0;padding-inline:6px}.watch .seg button{padding:0 4px;font-size:11px}
.wl{flex:1}
.wr{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);border-top:1px solid var(--trait)}
.wr[data-on=true]{background:var(--cyan-voile)}
.wr:hover{background:var(--navy-850)}
.star{color:var(--navy-600);font-size:14px;padding-left:6px}
.star[aria-pressed=true]{color:var(--cyan)}
.wb{display:grid;grid-template-columns:minmax(0,1fr) 40px auto;align-items:center;gap:6px;min-height:50px;padding:6px 10px 6px 4px;text-align:left}
.wb small{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb .r b{display:block;font-weight:400}
.quote{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding:10px 14px 6px}
.quote h1{font-size:19px}
.quote h1 small{font:400 12px var(--texte);color:var(--encre-3);margin-left:6px}
.px{font:640 25px/1 var(--titre)}
.quote .stats{display:flex;gap:14px;margin-left:auto;font-size:11px;color:var(--encre-3)}
.quote .stats b{display:block;color:var(--encre);font-weight:400}
.outils{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:2px 8px 4px;border-bottom:1px solid var(--trait)}
.centre>.plot{flex:1;min-height:170px}
.ohlc{padding:5px 14px 0;font-size:11px;color:var(--encre-3);white-space:nowrap;overflow:hidden}
.ohlc b{color:var(--encre);font-weight:400;margin-right:8px}
.niveaux{flex:1;display:flex;flex-direction:column;font-size:12px;min-height:0;overflow:auto}
.bh,.niv,.print{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 10px;text-align:right}
.bh{color:var(--encre-3);font-size:10.5px;padding-block:3px}
.niveaux>:first-child{margin-top:auto}.niveaux>:last-child{margin-bottom:auto}
.niv{position:relative;flex:none;width:100%;min-height:20px;align-items:center;isolation:isolate}
.niv:hover{background:var(--navy-800)}
.niv i{position:absolute;z-index:-1;inset:1px 0 1px auto;background:var(--c)}
.mid{display:flex;justify-content:space-between;align-items:baseline;flex:none;padding:6px 10px;border-block:1px solid var(--trait)}
.mid b{font:640 16px var(--titre)}
.tape{flex:none;padding-bottom:6px;border-top:1px solid var(--trait)}
.print{font-size:11px;line-height:19px}
.tb{display:grid;gap:10px;padding:0 14px 14px}
.sens{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--navy-950);border-radius:var(--r2)}
.sens button{height:36px;border-radius:var(--r1);color:var(--encre-2);font-weight:600}
.sens [data-v=achat][aria-pressed=true]{background:var(--cyan);color:var(--sur-cyan)}
.sens [data-v=vente][aria-pressed=true]{background:var(--perte);color:#2A0808}
.types{display:grid;grid-template-columns:repeat(3,1fr)}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pcts button{height:26px;border-radius:4px;background:var(--navy-800);color:var(--encre-2);font-size:11px}
.pcts button:hover{color:var(--cyan)}
.prot{display:grid;grid-template-columns:auto 1fr 70px;gap:8px;align-items:center;font-size:12px;color:var(--encre-2)}
.prot .input{height:30px}
.recap{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--trait);font-size:12px}
.recap p{display:flex;justify-content:space-between;gap:8px;color:var(--encre-2)}
.recap p b{color:var(--encre);font-weight:400;text-align:right}
.recap p.total b{font-weight:600;font-size:15px}
.blotter .mh{border-bottom:1px solid var(--trait);min-height:38px;padding-block:3px}
.blotter td,.blotter th{padding-block:5px;font-size:12px}
.mtabs{display:none}

/* portefeuille, analyse, simulation */
.contrib{display:grid;grid-template-columns:62px minmax(40px,1fr) 78px;align-items:center;gap:10px;min-height:30px;font-size:12px}
.axe{position:relative;height:100%;min-height:30px}
.axe:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--trait-2)}
.axe i{position:absolute;top:8px;height:14px;background:var(--c)}
.onglets{display:flex;gap:var(--e5);border-bottom:1px solid var(--trait);overflow-x:auto}
.onglets button{flex:none;height:42px;color:var(--encre-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.onglets button[aria-selected=true]{color:var(--cyan);border-color:var(--cyan)}
.verdict{display:grid;gap:10px;padding:var(--e4)}
.verdict h2{font-size:19px}
.matrice{display:grid;gap:2px;font-size:11px}
.matrice>*{display:grid;place-items:center;min-height:38px;min-width:0;border-radius:3px;overflow:hidden}
.scenarios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--e3)}
.scen{display:grid;gap:6px;align-content:start;padding:14px;border:1px solid var(--trait);border-radius:var(--r2);text-align:left}
.scen:hover{border-color:var(--trait-2);background:var(--navy-900)}
.scen[aria-pressed=true]{border-color:var(--cyan);background:var(--cyan-voile)}
.scen b{font:620 16px var(--titre)}
.scen small{color:var(--encre-2);font-size:12px}
.curs{display:grid;gap:2px;font-size:12px;color:var(--encre-2)}
.curs span{display:flex;justify-content:space-between}
.curs output{color:var(--encre);font-weight:600}
.avap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 0 16px}
.avap strong{display:block;font:640 27px var(--titre);white-space:nowrap}
.avap small{color:var(--encre-3)}
.banque{display:grid;grid-template-columns:96px minmax(60px,1fr) 112px;align-items:center;gap:12px;width:100%;min-height:42px;border-top:1px solid var(--trait);text-align:left;font-size:12px}
.banque:hover,.banque[aria-pressed=true]{background:var(--cyan-voile)}
.piste{position:relative;height:100%;min-height:42px}
.piste .seuil{position:absolute;top:0;bottom:0;border-left:1px solid var(--trait-2)}
.piste .tige{position:absolute;top:20px;height:2px;background:var(--neutre)}
.piste .pt{position:absolute;top:16px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--navy-900)}

/* superpositions */
.voile{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(1,5,12,.72)}
.dialogue{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:14px;padding:22px;border:1px solid var(--trait-2);border-radius:var(--r3);background:var(--navy-850)}
.dialogue h2{font-size:21px}
.dialogue .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.formule{padding:12px;border-radius:var(--r1);background:var(--navy-950);color:var(--cyan)}
.palette{align-self:start;margin-top:9vh;width:min(570px,100%);padding:0;gap:0;overflow:hidden}
.palette .input{height:54px;border:0;border-bottom:1px solid var(--trait);border-radius:0;padding:0 18px;font-size:16px}
.res{max-height:52vh;overflow:auto;padding:6px}
.res button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:6px 12px;border-radius:var(--r1);text-align:left}
.res button:hover,.res button.sel{background:var(--cyan-voile)}
.toast{position:fixed;z-index:70;right:20px;bottom:74px;display:grid;gap:8px;pointer-events:none}
.toast p{max-width:360px;padding:12px 14px;border:1px solid var(--turquoise);border-radius:var(--r2);background:var(--navy-800)}
.toast p.err{border-color:var(--perte)}

/* identité */
#marque{height:100vh;height:100dvh;overflow:auto;scroll-behavior:smooth}
.bnav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:22px;height:66px;padding:0 max(20px,calc((100% - 1200px)/2));border-bottom:1px solid var(--trait);background:var(--navy-950)}
.bnav .logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.bnav .logo svg{width:30px;height:30px}
.bnav>a:not(.btn):not(.logo){color:var(--encre-2)}
.bnav>a:hover{color:var(--cyan)}
.bw{width:min(1200px,100%);margin:auto;padding-inline:20px}
.bhero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--navy-900),var(--navy-950));padding-top:74px}
.bhero .haut{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px 64px;align-items:end;position:relative;z-index:1}
.bhero h1{font-size:clamp(76px,13vw,168px);font-weight:720;line-height:.86;letter-spacing:-.01em}
.bhero h1 i{font-style:normal;color:var(--cyan)}
.bhero .pitch{display:grid;gap:16px;justify-items:start}
.bhero .pitch h2{font-size:31px}
.bhero .pitch p{color:var(--encre-2);font-size:16px}
.faisceau{position:relative;width:100%;aspect-ratio:1200/340;margin-top:8px}
.faisceau svg{width:100%;height:100%}
.bs{padding-block:76px;border-top:1px solid var(--trait);scroll-margin-top:66px}
.bs>.bt{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:12px 64px;margin-bottom:34px;align-items:end}
.bt h2{font-size:38px}
.bt p{color:var(--encre-2);font-size:16px;max-width:62ch}
.logos{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.plaque{display:flex;align-items:center;justify-content:center;gap:18px;min-height:190px;padding:24px;border-radius:var(--r2);background:var(--navy-900);position:relative}
.plaque small{position:absolute;left:14px;bottom:12px;color:var(--encre-3);font-size:11px}
.plaque.clair{background:#EDF5FB;color:#040B16}.plaque.clair small{color:#3C566F}.plaque.clair .word i{color:#086B78}
.plaque.cy{background:var(--cyan);color:var(--sur-cyan)}.plaque.cy small{color:var(--sur-cyan)}.plaque.cy .word i{color:inherit}
.plaque .word{font-size:54px}.plaque:not(:first-child) .word{font-size:27px}
.construction{display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px;align-items:center;margin-top:34px}
.construction ol{display:grid;gap:14px;color:var(--encre-2)}
.construction ol b{display:block;color:var(--encre);font:620 18px var(--titre)}
.couleurs{display:flex;height:270px;gap:2px}
.couleur{flex:var(--f,1);min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--c);color:var(--t);text-align:left;transition:flex .2s}
.couleur:hover{flex:calc(var(--f,1) + .7)}
.couleur b{font:620 16px var(--titre)}
.couleur small{font-size:12px}
.semant{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:30px}
.semant p{padding-top:12px;border-top:3px solid var(--c);color:var(--encre-2)}
.semant b{display:block;color:var(--encre)}.semant b.up{color:var(--gain)}.semant b.dn{color:var(--perte)}
.typo{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.geant{font:700 150px/1 var(--titre)}
.geant.t2{font:400 150px/1 var(--texte)}
.echelle p{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:10px 0;border-top:1px solid var(--trait)}
.echelle small{color:var(--encre-3);white-space:nowrap}
.compo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.compo>div{display:grid;gap:10px;align-content:start;justify-items:start;min-width:0}
.compo h3{font-size:17px;margin-bottom:4px}
.squel{width:100%;height:14px;border-radius:4px;background:var(--navy-700)}
.voix td,.voix th{white-space:normal;text-align:left;padding:14px 10px}
.voix th{position:static;background:none;font-size:12px}
.ecrans{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ecrans a{display:grid;gap:8px;align-content:start;padding:18px 14px 22px;background:var(--navy-900);border-radius:var(--r2);color:var(--encre-2)}
.ecrans a:hover{background:var(--cyan-voile)}
.ecrans .ic{width:26px;height:26px;color:var(--cyan);margin-bottom:20px}
.ecrans b{color:var(--encre);font:620 18px var(--titre)}

/* adaptation */
@media(max-width:1340px){
  .desk{grid-template-columns:208px minmax(320px,1fr) 200px 258px}
  .wb svg{display:none}.wb{grid-template-columns:minmax(0,1fr) auto}
  .quote .stats>span:nth-child(3){display:none}
}
@media(max-width:1120px){
  .desk{grid-template-columns:190px minmax(300px,1fr) 258px}
  .desk>.book{display:none}.desk>.blotter{grid-column:2}.watch .seg button{padding:0 2px}.watch .filtres{padding-inline:4px}
  .c3,.c4,.c5{grid-column:span 6}.c7,.c8,.c9{grid-column:span 12}
  .scenarios{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  :root{--haut:56px;--film:50px}
  #app{grid-template:var(--haut) minmax(0,1fr) var(--film) 62px/minmax(0,1fr)}
  .rail{grid-row:4;flex-direction:row;padding:4px;border:0;border-top:1px solid var(--trait);gap:0}
  .rail>.logo,.rail .bas{display:none}
  .nav{min-height:52px;flex:1;min-width:0;font-size:9.5px;white-space:nowrap}
  .top{grid-row:1;padding:0 12px;gap:8px}main{grid-row:2}.film{grid-row:3;gap:6px;padding:0 10px}
  .search{width:36px;padding:0 9px}.search span,.search kbd,.top .modes,.top .avatar{display:none}.top .fin{gap:8px}.top .fict{white-space:normal;max-width:66px;line-height:1.15;font-size:10px}.top>a .word{font-size:18px}.btn.mini{min-height:36px}
  .film .opt{display:none}.fdate{min-width:98px}.bobine .futur{font-size:0}
  .page{padding:14px 12px;grid-template-columns:minmax(0,1fr)}
  .g12>*{grid-column:span 12}
  .hero{grid-template-columns:minmax(0,1fr)}.hero .recit{padding:16px}.hero .courbe{padding:8px 0}.hv{font-size:36px}
  .faits{grid-template-columns:1fr 1fr}.fait:nth-child(odd){border-left:0}.fait:nth-child(n+3){border-top:1px solid var(--trait)}
  .fait strong{font-size:18px}
  .desk{display:flex;flex-direction:column;min-height:0}
  .mtabs{display:flex;flex:none;justify-content:space-around;padding:4px;border-bottom:1px solid var(--trait)}
  .desk>.col{display:none;border:0}
  .desk[data-vue=graphe]>.centre,.desk[data-vue=actifs]>.watch,.desk[data-vue=carnet]>.book,.desk[data-vue=ordre]>.ticket,.desk[data-vue=suivi]>.blotter{display:flex;flex:1;height:auto}
  .quote .stats{display:none}
  .scenarios{grid-template-columns:minmax(0,1fr)}
  .banque{grid-template-columns:78px minmax(40px,1fr) 100px;gap:6px}
  .avap strong{font-size:20px}
  .toast{left:12px;right:12px;bottom:126px}
  .bnav{gap:10px}.bnav>a:not(.btn):not(.logo){display:none}
  .bhero{padding-top:44px}.bhero .haut,.bs>.bt,.construction,.typo{grid-template-columns:minmax(0,1fr)}
  .faisceau{height:230px;aspect-ratio:auto}.logos,.compo,.semant{grid-template-columns:minmax(0,1fr)}
  .plaque .word{font-size:40px}.couleurs{flex-direction:column;height:auto}.couleur{min-height:70px}
  .ecrans{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.geant,.geant.t2{font-size:100px}
  .echelle p{flex-wrap:wrap}.bs{padding-block:52px}.bt h2{font-size:31px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Sections de la version 2 */
.date-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;flex:none;border:1px solid var(--trait-2);border-radius:var(--r1);font-weight:600;white-space:nowrap}
.date-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.date-btn .ic{width:16px;height:16px}
.regime{display:flex;flex:none;padding:3px;gap:2px;border-radius:var(--r1);background:var(--navy-900)}
.regime button{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:4px;color:var(--encre-2);font-size:12px;font-weight:600}
.regime button[aria-pressed=true]{background:var(--navy-700);color:var(--encre)}
.regime i{width:7px;height:7px;border-radius:50%;background:var(--neutre)}
.regime [aria-pressed=true] i{background:var(--gain)}
.search{width:min(250px,18vw);min-width:36px}
.rail{overflow-y:auto}
.rail .nav{flex:none}
.rail .plus{display:none}
.nav span{white-space:nowrap}
.chat-o{color:var(--cyan)}
.chat-o .ic{width:16px;height:16px}
button.play:disabled{opacity:.42}
.surt,.jsur{color:var(--cyan);font-size:12px;font-weight:600}
.barre{display:block;flex:1;height:7px;min-width:30px;overflow:hidden;border-radius:4px;background:var(--navy-700)}
.barre em{display:block;height:100%;border-radius:inherit;background:var(--cyan)}
.acts-g{display:flex;flex-wrap:wrap;gap:8px}
textarea.zone{height:72px;padding:9px 10px;resize:vertical;font:inherit}
.centre-t{text-align:center;color:var(--encre-2)}
.bh2{display:grid;grid-template-columns:minmax(90px,38%) minmax(30px,1fr) auto;align-items:center;gap:10px;min-height:32px;font-size:12px}
.bh2>span{color:var(--encre-2)}
.bh2>i{height:9px;border-radius:3px;background:var(--navy-800);overflow:hidden}
.bh2>i b{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--c)}
.bh2>em{font-style:normal;min-width:42px;text-align:right}
.anneau{justify-self:center;display:grid;place-items:center;width:128px;height:128px;margin:6px auto;border-radius:50%;background:radial-gradient(closest-side,var(--navy-900) 80%,transparent 82%),conic-gradient(var(--cyan) var(--p),var(--navy-700) 0)}
.anneau b{font:640 34px var(--titre)}
.anneau small{font:12px var(--texte);color:var(--encre-3)}

/* dashboard */
.refs{display:flex;align-items:stretch;gap:12px;min-width:0}
.refs .field{flex:none;width:184px;align-content:center}
.refs-l{display:flex;flex:1;min-width:0;overflow-x:auto}
.refs-l button{flex:1 0 auto;padding:6px 14px;border-left:1px solid var(--trait);text-align:left;line-height:1.35;white-space:nowrap}
.refs-l button:hover{background:var(--navy-900)}
.refs-l button[aria-pressed=true]{background:var(--cyan-voile)}
.refs-l small{display:block;color:var(--encre-2);font-size:11px}
.refs-l b{margin-right:8px;font-weight:600}
.refs-l button>span{font-size:11px}
.total-ret{padding:10px 0;border-block:1px solid var(--trait-2)}
.total-ret small{display:block;color:var(--encre-2);font-size:12px}
.total-ret strong{display:block;font:640 27px/1.2 var(--titre);margin:3px 0}
.total-ret span{color:var(--encre-2);font-size:12px}
.hero .recit .phrase{font-size:14px}
.risque-d{display:grid;grid-template-columns:minmax(140px,180px) minmax(0,1fr);gap:22px}
.risque-d>.vide{grid-column:1/-1}
.risque-d .hv{font-size:30px}
.rscore{margin:6px 0 10px;color:var(--encre-2)}
.rscore b{color:var(--encre);font:620 22px var(--titre)}
.echelle-r{position:relative;height:8px;margin:0 0 14px;border-radius:4px;background:linear-gradient(90deg,var(--m-gain) 0 33.3%,var(--alerte) 33.3% 66.6%,var(--m-perte) 66.6%)}
.echelle-r i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--encre);box-shadow:0 0 0 2px var(--navy-900)}
.rl{display:grid;grid-template-columns:minmax(80px,1fr) 52px minmax(30px,90px) 64px;gap:10px;align-items:center;min-height:33px;font-size:12px}
.rl>span{color:var(--encre-2)}
.rl>b,.rl>small{text-align:right;white-space:nowrap}
.rl>small{color:var(--encre-3)}
.contrib.large-n{grid-template-columns:104px minmax(40px,1fr) 70px}
.methode{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
.methode h3{font-size:15px}

/* marché */
.choix-m{flex:none;padding:10px 12px 12px}
.choix-m select{font-weight:600;height:40px}
.watch .wr{grid-template-columns:minmax(0,1fr)}
.watch .wb{padding-left:12px}

/* analyse */
.demi{width:100%;max-width:240px;justify-self:center}
.colonnes{display:flex;justify-content:space-around;gap:8px;height:190px;margin:14px 0}
.colonnes>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.colonnes span{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-end;gap:2px;border-bottom:1px solid var(--trait-2)}
.colonnes i{width:min(26px,42%);border-radius:3px 3px 0 0;background:var(--c)}
.colonnes b{font-size:11px;font-weight:400;color:var(--encre-2)}
mark{padding:0 3px;border-radius:3px;color:inherit;background:none}
mark.g{background:rgba(79,209,176,.16);color:var(--gain)}
mark.l{background:rgba(255,133,128,.16);color:var(--perte)}

/* La Salle Obscure : accueil */
.jlobby{display:grid;gap:18px;min-width:0}
.jhero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px 60px;align-items:end;padding:24px 0 8px}
.jhero h1{font-size:clamp(40px,5.6vw,76px);font-weight:720;line-height:.95;margin:6px 0 14px}
.jhero div>p:last-child{max-width:52ch;font-size:16px;color:var(--encre-2)}
.jregles{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.jregles li{display:flex;align-items:center;gap:10px;color:var(--encre-2);font-size:13px}
.jregles b{display:grid;place-items:center;width:26px;height:26px;flex:none;border:1px solid var(--trait-2);border-radius:50%;color:var(--cyan)}
.affiches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.affiche{position:relative;display:block;min-width:0;aspect-ratio:2/3;max-height:310px;overflow:hidden;border:1px solid var(--trait);border-radius:var(--r2);background:#050E1A;text-align:left;transition:transform .2s}
.affiche>svg{width:100%;height:76%}
.affiche:hover{border-color:var(--encre-3)}
.affiche[aria-pressed=true]{border:2px solid var(--cyan);transform:translateY(-6px)}
.aff-t{position:absolute;inset:auto 0 0;display:grid;gap:3px;padding:24px 10px 10px;background:linear-gradient(transparent,#050E1A 22%)}
.aff-t small{color:var(--encre-2);font-size:11px}
.aff-t b{font:700 clamp(15px,1.45vw,21px)/1.05 var(--titre)}
.aff-t em{color:var(--encre-3);font-size:10.5px;font-style:normal}
.billet{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;border-radius:var(--r2);background:var(--navy-800);overflow:hidden}
.billet>*{padding:16px 20px}
.b-film small{color:var(--cyan)}
.b-film h2{font-size:27px;margin:2px 0 6px}
.b-film p{color:var(--encre-2);font-size:13px}
.b-film .dim{margin-top:8px;font-size:12px}
.feux{display:inline-flex;gap:3px;vertical-align:middle;margin-inline:4px}
.feux i{width:12px;height:6px;border-radius:2px;background:var(--navy-600)}
.feux i.on{background:var(--perte)}
.b-diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center;border-left:2px dashed var(--trait-2)}
.b-diff button{display:grid;gap:3px;min-height:78px;padding:10px;border:1px solid var(--trait-2);border-radius:var(--r1);text-align:left;align-content:center}
.b-diff button[aria-pressed=true]{border-color:var(--cyan);background:var(--cyan-voile)}
.b-diff small{color:var(--encre-2);font-size:11px}
.debuter{align-self:stretch;height:auto;min-height:64px;padding-inline:38px;border-radius:0;font:720 23px var(--titre)}
.debuter .ic{fill:currentColor}

/* La Salle Obscure : projection */
.en-jeu #app{grid-template-rows:0 minmax(0,1fr) 0}
.en-jeu .top,.en-jeu .film,.en-jeu .chat{display:none}
.en-jeu main{grid-row:1/4;grid-column:2;overflow:hidden}
.jpartie{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--navy-950)}
.jhud{display:flex;align-items:center;gap:8px 22px;padding:8px 14px;border-bottom:1px solid var(--trait);min-width:0}
.jtitre{margin-right:auto;min-width:0}
.jtitre b{display:block;font:680 18px/1.1 var(--titre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jtitre small,.jstat small,.jpeur small{display:block;color:var(--encre-2);font-size:11px;white-space:nowrap}
.jstat>b{font:620 17px var(--titre);white-space:nowrap}
.jstat>b span{font:12px var(--texte);margin-left:5px}
.jpeur{width:150px}
.jpeur small b{color:var(--encre)}
.jpeur i{display:block;height:8px;margin-top:4px;border-radius:4px;background:var(--navy-700);overflow:hidden}
.jpeur em{display:block;height:100%;transition:width .5s,background .5s}
.jhud .ib[aria-pressed=true]{color:var(--cyan)}
.jsalle{position:relative;min-height:0;overflow:hidden}
.jsalle canvas{position:absolute;inset:0;width:100%;height:100%}

.jclap{display:grid;justify-items:center;gap:8px;text-align:center}

.dilemme{width:min(780px,100%);display:grid;gap:10px;padding:20px;border:1px solid var(--trait-2);border-radius:var(--r3);background:var(--navy-900)}
.dilemme>small{color:var(--cyan);font-weight:600}
.d-news{color:var(--encre-2)}
.dilemme h2{font-size:clamp(22px,3vw,32px)}
.d-choix{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.d-choix b{font:640 17px var(--titre)}
.d-choix small{color:var(--encre-2);font-size:12px}
.d-conseil{color:var(--alerte);font-size:12px}
.jpont{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;border-top:1px solid var(--trait)}
.jactif{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px 8px;border-right:1px solid var(--trait);min-width:0}
.jactif[data-on=true]{background:var(--cyan-voile)}
.ja-n{grid-column:1/3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 6px;text-align:left}
.ja-n span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ja-n small{grid-column:1/3;color:var(--encre-2);font-size:11px}
.ja-a,.ja-v{min-height:30px;border-radius:4px;font-size:12px;font-weight:600}
.ja-a{background:var(--cyan);color:var(--sur-cyan)}
.ja-v{background:var(--navy-700);color:var(--perte)}
.jcash{display:grid;align-content:center;padding:6px 16px}
.jcash small{color:var(--encre-2);font-size:11px}
.jcash b{font:640 18px var(--titre)}

/* générique */

.palme>svg{width:150px;margin-bottom:-18px}
.gscore{font:720 clamp(76px,11vw,132px)/1 var(--titre)}
.palme h1{font-size:34px}
.palme>p:last-child{color:var(--encre-2)}

/* stress */
.scenb{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-width:0}
.scenb .scen{flex:1 0 136px;gap:4px;padding:10px}
.scenb .scen b{font-size:14px}
.scenb .scen small{font-size:11px}
.duel{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--trait)}
.duel>div{padding:14px 16px;min-width:0}
.duel>div+div{border-left:1px solid var(--trait)}

.duel>p{grid-column:1/3;padding:10px 16px;background:var(--cyan-voile);font-size:13px}
.groupe-b{padding:14px 0 6px;color:var(--encre-2);font-size:12px;font-weight:600}
.banque{grid-template-columns:118px minmax(50px,1fr) 118px}

/** Chemin aléatoire qui passe exactement par ses points d'ancrage. */
function pont(noeuds,valeurs,brut){
  const out = [];
  let k = 0;
  for (let i = 0; i < N; i++) {
    while (k < noeuds.length - 2 && i > noeuds[k + 1]) k++;
    const u = (i - noeuds[k]) / (noeuds[k + 1] - noeuds[k]);
    out.push(valeurs[k] * (1 - u) + valeurs[k + 1] * u + brut[i] - (brut[noeuds[k]] * (1 - u) + brut[noeuds[k + 1]] * u));
  }
  return out;
}
const agite = d => d > '2020-02-18' && d < '2020-05-01' ? 2.8 : d.startsWith('2022') ? 1.5 : d > '2025-03-25' && d < '2025-05-10' ? 2 : 1;
const CHEMIN_M = (() => {
  const dates = ['2018-01-02','2018-09-20','2018-12-24','2020-02-19','2020-03-23','2021-01-04','2022-01-03','2022-06-16','2022-08-16','2022-10-12','2023-07-31','2023-10-27','2024-07-16','2024-08-05','2025-02-19','2025-04-08','2026-01-02','2026-11-20'];
  const niveaux = [2700,2930,2350,3390,2240,3730,4800,3670,4300,3580,4590,4120,5670,5190,6140,4980,6860,6910];
  const r = alea(2020), brut = [0];
  for (let i = 1; i < N; i++) brut.push(brut[i - 1] + normale(r) * .0062 * agite(isoJour(i)));
  return pont(dates.map(indexDate),niveaux.map(Math.log),brut);
})();
const INDICE = CHEMIN_M.map(Math.exp);

const DATA = {};
ACTIFS.forEach((a,n) => {
  const r = alea(700 + n * 97), brut = [0];
  for (let i = 1; i < N; i++) brut.push(brut[i - 1] + a.beta * (CHEMIN_M[i] - CHEMIN_M[i - 1]) + normale(r) * a.vol * Math.sqrt(agite(isoJour(i))));
  const cl = pont(REPERES_DATES.map(indexDate),a.ancres.map(Math.log),brut).map(Math.exp);
  DATA[a.s] = cl.map((c,i) => {
    const prec = i ? cl[i - 1] : c, o = prec * (1 + normale(r) * a.vol * .25);
    return {o, c, h:Math.max(o,c) * (1 + r() * a.vol * .8), l:Math.min(o,c) * (1 - r() * a.vol * .8), v:(.5 + r()) * (1 + Math.abs(c / prec - 1) * 25)};
  });
});

/* ---------- état et comptabilité ---------- */
let S;
const barre = (s,t = S.t) => DATA[s][t];
const prix = (s,t = S.t) => DATA[s][t].c;
const variation = (s,t = S.t) => prix(s,t) / prix(s,t - 1) - 1;
const bid = s => prix(s) * (1 - COUT[PAR_S[s].cl].ecart / 20000);
const ask = s => prix(s) * (1 + COUT[PAR_S[s].cl].ecart / 20000);
const tauxFrais = s => COUT[PAR_S[s].cl].frais / 10000;

const reserveCash = () => S.ordres.filter(o => o.statut === 'En attente' && o.sens === 'achat')
  .reduce((x,o) => x + o.q * o.niveau * (1 + tauxFrais(o.s)), 0);
const reserveQte = s => S.ordres.filter(o => o.statut === 'En attente' && o.sens === 'vente' && o.s === s)
  .reduce((x,o) => x + o.q, 0);
const disponible = () => S.cash - reserveCash();
const vendable = s => (S.pos[s]?.q || 0) - reserveQte(s);

function bilan(t = S.t){
  const lignes = Object.entries(S.pos).map(([s,p]) => {
    const px = prix(s,t), val = p.q * px;
    return {s, ...p, px, val, pnl:val - p.q * p.moy, pct:px / p.moy - 1, jour:p.q * (px - prix(s,t - 1))};
  }).sort((a,b) => b.val - a.val);
  const investi = lignes.reduce((x,l) => x + l.val, 0), total = S.cash + investi;
  lignes.forEach(l => l.poids = l.val / total);
  return {lignes, investi, total, gain:total - CAPITAL, perf:total / CAPITAL - 1,
    latent:lignes.reduce((x,l) => x + l.pnl, 0), jour:lignes.reduce((x,l) => x + l.jour, 0)};
}
function noterValeur(){
  const point = {t:S.t, v:bilan().total}, d = S.hist.at(-1);
  if (d && d.t === S.t) S.hist[S.hist.length - 1] = point; else S.hist.push(point);
}
function executer(o,px){
  const brut = o.q * px, f = brut * tauxFrais(o.s);
  let pnl = null;
  if (o.sens === 'achat') {
    const p = S.pos[o.s] || {q:0,moy:0,depuis:S.t};
    p.moy = (p.q * p.moy + brut) / (p.q + o.q);
    p.q += o.q; S.pos[o.s] = p; S.cash -= brut + f;
  } else {
    const p = S.pos[o.s];
    pnl = o.q * (px - p.moy); S.realise += pnl;
    p.q -= o.q; S.cash += brut - f;
    if (p.q < 1e-8) { delete S.pos[o.s]; delete S.regles[o.s]; }
  }
  S.frais += f; o.statut = 'Exécuté';
  S.execs.unshift({s:o.s,sens:o.sens,q:o.q,px,f,pnl,t:S.t,motif:o.motif});
}
/** Renvoie {erreur} ou {ordre}. */
function placer(d){
  const {s,sens,type,q,niveau,sl,tp} = d;
  if (!(q > 0) || !Number.isFinite(q)) return {erreur:'Saisissez une quantité supérieure à zéro.'};
  if (type !== 'marche' && !(niveau > 0)) return {erreur:'Indiquez un prix pour cet ordre.'};
  const p = prix(s);
  if (type === 'stop' && ((sens === 'achat' && niveau <= p) || (sens === 'vente' && niveau >= p)))
    return {erreur:`Un stop ${sens === 'achat' ? "d’achat se place au-dessus" : 'de vente se place sous'} du prix actuel.`};
  const ref = type === 'marche' ? (sens === 'achat' ? ask(s) : bid(s)) : niveau;
  if (sens === 'achat' && q * ref * (1 + tauxFrais(s)) > disponible() + 1e-6) return {erreur:'Le total dépasse vos liquidités. Réduisez la quantité.'};
  if (sens === 'vente' && q > vendable(s) + 1e-8) return {erreur:'Vous ne détenez pas cette quantité. Vérifiez aussi vos ordres en attente.'};
  const o = {id:S.seq++,s,sens,type,q,niveau:ref,sl,tp,t:S.t,statut:'En attente'};
  S.ordres.unshift(o);
  const immediat = type === 'marche' || (type === 'limite' && (sens === 'achat' ? niveau >= ask(s) : niveau <= bid(s)));
  if (immediat) { executer(o, sens === 'achat' ? ask(s) : bid(s)); proteger(o); }
  noterValeur();
  return {ordre:o};
}
function proteger(o){
  if (o.sens === 'achat' && (o.sl || o.tp)) S.regles[o.s] = {sl:o.sl, tp:o.tp};
}
/** Avance d'une séance et renvoie les événements à annoncer. */
function seanceSuivante(){
  if (S.t >= N - 1) return [];
  S.t++;
  const ev = [];
  // Les protections passent avant les autres ordres de vente.
  for (const [s,r] of Object.entries({...S.regles})) {
    const p = S.pos[s]; if (!p) continue;
    const b = barre(s), bas = r.sl && p.moy * (1 - r.sl / 100), haut = r.tp && p.moy * (1 + r.tp / 100);
    let px, motif;
    if (bas && b.l <= bas) { px = Math.min(b.o,bas); motif = 'Stop-loss'; }
    else if (haut && b.h >= haut) { px = Math.max(b.o,haut); motif = 'Prise de profit'; }
    if (!motif) continue;
    S.ordres.forEach(o => { if (o.s === s && o.sens === 'vente' && o.statut === 'En attente') o.statut = 'Annulé'; });
    const o = {id:S.seq++,s,sens:'vente',type:'stop',q:p.q,niveau:px,t:S.t,motif};
    S.ordres.unshift(o); executer(o,px);
    ev.push(`${motif} : ${s} vendu à ${fPx(px)} USD.`);
  }
  for (const o of [...S.ordres].reverse()) {
    if (o.statut !== 'En attente') continue;
    const b = barre(o.s), achat = o.sens === 'achat', n = o.niveau;
    let px = null;
    if (o.type === 'limite') { if (achat && b.l <= n) px = Math.min(b.o,n); if (!achat && b.h >= n) px = Math.max(b.o,n); }
    else { if (achat && b.h >= n) px = Math.max(b.o,n); if (!achat && b.l <= n) px = Math.min(b.o,n); }
    if (px === null) continue;
    if (achat && o.q * px * (1 + tauxFrais(o.s)) > S.cash) { o.statut = 'Refusé'; ev.push(`Ordre ${o.s} refusé : liquidités insuffisantes.`); continue; }
    if (!achat && o.q > (S.pos[o.s]?.q || 0) + 1e-8) { o.statut = 'Annulé'; continue; }
    executer(o,px); proteger(o);
    ev.push(`${achat ? 'Achat' : 'Vente'} ${o.s} exécuté à ${fPx(px)} USD.`);
  }
  ev.push(...reglerContrats());
  noterValeur();
  return ev;
}
/** Sans argument : portefeuille de démonstration. Avec une date : simulation vierge qui y commence. */
function initialiser(debut,fin){
  const demo = debut === undefined, t0 = demo ? DEBUT_DEMO : debut;
  S = {t:t0,debut:t0,cash:CAPITAL,pos:{},ordres:[],execs:[],regles:{},hist:[],frais:0,realise:0,assur:0,contrats:[],seq:1001,direct:false};
  noterValeur();
  if (!demo && fin === undefined) return;
  const cible = demo ? DEPART : fin, achat = (s,part) => {
    const pas = prix(s) > 500 ? 1000 : 1;
    placer({s,sens:'achat',type:'marche',q:Math.floor(CAPITAL * part / ask(s) * pas) / pas});
  };
  while (S.t < cible) {
    if (S.t === t0 + 2) [['AAPL',.17],['MSFT',.13],['JPM',.11],['OR',.12]].forEach(([s,p]) => achat(s,p));
    if (S.t === t0 + 22) [['KO',.11],['BTC',.07],['NVDA',.08]].forEach(([s,p]) => achat(s,p));
    if (S.t === t0 + 60 && S.pos.NVDA) placer({s:'NVDA',sens:'vente',type:'marche',q:Math.floor(S.pos.NVDA.q / 2)});
    seanceSuivante();

}

/* ---------- indicateurs : uniquement des données ≤ t ---------- */
const clotures = (s,t = S.t) => DATA[s].slice(0,t + 1).map(b => b.c);
function moyenne(a,n){
  let x = 0;
  return a.map((v,i) => { x += v; if (i >= n) x -= a[i - n]; return i >= n - 1 ? x / n : null; });
}
function ema(a,n){
  const k = 2 / (n + 1), out = []; let e = a[0];
  a.forEach(v => { e = k * v + (1 - k) * e; out.push(e); });
  return out;
}
function rsi(a,n = 14){
  const out = [null]; let g = 0, p = 0;
  for (let i = 1; i < a.length; i++) {
    const d = a[i] - a[i - 1];
    if (i <= n) { g += Math.max(d,0) / n; p += Math.max(-d,0) / n; }
    else { g = (g * (n - 1) + Math.max(d,0)) / n; p = (p * (n - 1) + Math.max(-d,0)) / n; }
    out.push(i < n ? null : g + p === 0 ? 50 : 100 * g / (g + p));
  }
  return out;
}
function macd(a){
  const l = ema(a,26), m = ema(a,12).map((v,i) => v - l[i]), sig = ema(m,9);
  return {m, sig, h:m.map((v,i) => v - sig[i])};
}
const rendements = a => a.slice(1).map((v,i) => v / a[i] - 1);
const moy = a => a.reduce((x,v) => x + v,0) / (a.length || 1);
const ecart = a => { const m = moy(a); return Math.sqrt(a.reduce((x,v) => x + (v - m) ** 2,0) / Math.max(1,a.length - 1)); };
function correlation(a,b){
  const x = moy(a), y = moy(b); let n = 0, u = 0, v = 0;
  a.forEach((q,i) => { n += (q - x) * (b[i] - y); u += (q - x) ** 2; v += (b[i] - y) ** 2; });
  return n / (Math.sqrt(u * v) || 1);
}
function pireBaisse(a){
  let pic = -Infinity, pire = 0;
  a.forEach(v => { pic = Math.max(pic,v); pire = Math.max(pire,1 - v / pic); });
  return pire;
}
/* Niveau de risque proposé : moyenne pondérée de cinq familles, avec un plancher de sécurité. */
const POIDS_RISQUE = [
  ['vol','Volatilité',.15,.15,.30],['v95','VaR 95 %',.15,.01,.025],['cvar','CVaR 95 %',.25,.015,.035],
  ['mdd','Maximum drawdown',.20,.10,.20],['conc','Risque de concentration',.25,.25,.50]];
const SEUIL_CRITIQUE = 250 / 3;
function noter(v,bas,haut){
  const x = v <= bas ? v / bas / 3 : v <= haut ? 1 / 3 + (v - bas) / (haut - bas) / 3 : 2 / 3 + (v - haut) / haut / 3;
  return Math.min(1,x) * 100;
}
const rangNote = x => x > 200 / 3 ? 2 : x > 100 / 3 ? 1 : 0;
function mesurerPoids(poids,t = S.t){
  const rp = [], ls = Object.entries(poids);
  for (let i = Math.max(1,t - 250); i <= t; i++) rp.push(ls.reduce((x,[s,w]) => x + w * (prix(s,i) / prix(s,i - 1) - 1),0));
  const pertes = rp.map(x => -x).sort((x,y) => x - y), pos = (pertes.length - 1) * .95, k = Math.floor(pos);
  const v95 = Math.max(0,pertes[k] + (pos - k) * ((pertes[k + 1] ?? pertes[k]) - pertes[k]));
  const queue = pertes.filter(x => x >= v95), cvar = queue.length ? Math.max(0,moy(queue)) : v95, courbe = [1], sect = {};
  rp.forEach(x => courbe.push(courbe.at(-1) * (1 + x)));
  ls.forEach(([s,w]) => sect[PAR_S[s].sect] = (sect[PAR_S[s].sect] || 0) + w);
  const maxi = Math.max(0,...ls.map(x => x[1])), maxSect = Math.max(0,...Object.values(sect));
  const val = {vol:ecart(rp) * Math.sqrt(252),v95,cvar,mdd:pireBaisse(courbe),conc:maxi};
  const familles = POIDS_RISQUE.map(([id,nom,w,bas,haut]) => {
    const note = id === 'conc' ? Math.max(noter(maxi,bas,haut),noter(maxSect,.4,.6)) : noter(val[id],bas,haut);
    return {id,nom,w,bas,haut,v:val[id],note,pts:note * w};
  });
  const score = familles.reduce((x,f) => x + f.pts,0), pire = [...familles].sort((x,y) => y.note - x.note)[0];
  const plancher = pire.note >= SEUIL_CRITIQUE ? 2 : pire.note > 200 / 3 ? 1 : 0;
  return {...val,rp,maxi,maxSect,familles,score,pire,moyenne:rangNote(score),plancher,niveau:Math.max(rangNote(score),plancher)};
}
function risque(){
  const b = bilan(), m = mesurerPoids(Object.fromEntries(b.lignes.map(l => [l.s,l.poids])));
  const vals = S.hist.map(x => x.v), dd = pireBaisse(vals), baisse = 1 - b.total / Math.max(...vals);
  const rang = (v,x,y) => v > y ? 2 : v > x ? 1 : 0;
  // règle du projet actuel (risque/synthese.py), gardée pour comparer
  const criteres = [
    ['VaR 95 %',m.v95,rang(m.v95,.01,.025)],['Plus grosse position',m.maxi,rang(m.maxi,.25,.5)],
    ['Plus gros secteur',m.maxSect,rang(m.maxSect,.4,.6)],['Baisse depuis le sommet',baisse,rang(baisse,.1,.2)]];
  return {...m,dd,baisse,criteres,vide:!b.lignes.length,ancien:b.lignes.length ? Math.max(...criteres.map(c => c[2])) : 0};

const STRATS = {garder:'Achat et conservation',sma:'Croisement de moyennes',rsi:'RSI 30 / 70',macd:'MACD'};
function backtest(s,cle,rap = 20,lent = 50){
  const c = clotures(s), a = moyenne(c,rap), b = moyenne(c,lent), r = rsi(c), m = macd(c);
  const k = (COUT[PAR_S[s].cl].ecart / 2 + COUT[PAR_S[s].cl].frais) / 10000;
  let v = 100, en = 0, cible = cle === 'garder' ? 1 : 0, n = 0;
  const depart = Math.max(60,c.length - 505), out = [{t:depart,v}];
  for (let i = depart + 1; i < c.length; i++) {
    const j = i - 1, o = DATA[s][i].o;
    if (cle === 'sma') cible = +(a[j] !== null && b[j] !== null && a[j] > b[j]);
    if (cle === 'rsi') { if (r[j] < 30) cible = 1; if (r[j] > 70) cible = 0; }
    if (cle === 'macd') cible = +(m.m[j] > m.sig[j]);
    if (en) v *= o / c[j];
    if (cible !== en) { v *= 1 - k; n++; en = cible; }
    if (en) v *= c[i] / o;
    out.push({t:i,v});
  }
  const vs = out.map(x => x.v), rr = rendements(vs), sd = ecart(rr);
  return {cle, pts:out, perf:v / 100 - 1, dd:pireBaisse(vs), vol:sd * Math.sqrt(252), sharpe:sd ? moy(rr) / sd * Math.sqrt(252) : 0, n};
}

/** Le symbole : trois bougies décroissantes qui dessinent « lecture ». */
function logo(a = '#3BE3EA',b = '#18C3B8',c = '#0E8F98',meches = true){
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${meches ? `<path d="M12.5 1v46" stroke="${a}" stroke-width="2"/><path d="M24.5 9v30" stroke="${b}" stroke-width="2"/><path d="M36.5 16v16" stroke="${c}" stroke-width="2"/>` : ''}<rect x="8" y="6" width="9" height="36" rx="2" fill="${a}"/><rect x="20" y="13" width="9" height="22" rx="2" fill="${b}"/><rect x="32" y="19.5" width="9" height="9" rx="2" fill="${c}"/></svg>`;
}
const motMarque = '<span class="word">Séance<i>.</i></span>';

/* ---------- géométrie ---------- */
function graduations(min,max,n = 5){
  const brut = (max - min) / n || 1, p = 10 ** Math.floor(Math.log10(brut));
  const pas = [1,2,2.5,5,10].map(x => x * p).find(x => x >= brut), out = [];
  for (let v = Math.ceil(min / pas) * pas; v <= max + pas * 1e-6; v += pas) out.push(Math.abs(v) < pas * 1e-6 ? 0 : v);
  return out;
}
function chemin(a,x,y){
  let d = '', leve = true;
  a.forEach((v,i) => {
    if (v === null || v === undefined) { leve = true; return; }
    d += `${leve ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; leve = false;
  });
  return d;
}
function mini(a,w = 40,h = 20){
  const lo = Math.min(...a), hi = Math.max(...a);
  const d = chemin(a,i => i * w / (a.length - 1),v => h - 2 - (v - lo) / (hi - lo || 1) * (h - 4));
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(${a.at(-1) >= a[0] ? '--m-gain' : '--m-perte'})" stroke-width="1.5"/></svg>`;
}
let compteur = 0;
const hachures = id => `<defs><pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="2" height="7" fill="#17304C"/></pattern></defs>`;

function poser(el,svg,w,h,meta){
  el._meta = meta;
  el.innerHTML = `<svg width="${w}" height="${h}" role="img" aria-label="${esc(el.dataset.nom || 'Graphique')}">${svg}</svg><i class="viseur" hidden></i><div class="bulle" hidden></div>`;
}

/** Graphique de lignes : un seul axe, légende externe, lecture au survol. */
function lignes(el,series,o = {}){
  const w = el.clientWidth, h = el.clientHeight;
  if (w < 60 || h < 50) return;
  const id = 'h' + (++compteur), g = 10, d = o.droite ?? 58, haut = 12, bas = o.dates === false ? 8 : 24;
  const fut = o.futur ? Math.min(74,w * .12) : 0, iw = w - g - d - fut, n = series[0].v.length;
  const tous = series.flatMap(s => s.v.filter(v => v !== null)).concat(o.reperes || []);
  let lo = o.min ?? Math.min(...tous), hi = o.max ?? Math.max(...tous);
  const marge = (hi - lo || 1) * .1; if (o.min === undefined) lo -= marge; if (o.max === undefined) hi += marge;
  const x = i => g + i * iw / Math.max(1,n - 1), y = v => haut + (hi - v) / (hi - lo) * (h - haut - bas), f = o.f || fM0;
  let s = hachures(id);
  graduations(lo,hi,Math.max(2,Math.floor(h / 65))).forEach(v => {
    s += `<path d="M${g} ${y(v)}H${w - d}" stroke="var(--trait)"/><text x="${w - d + 8}" y="${y(v) + 4}">${f(v)}</text>`;
  });
  (o.reperes || []).forEach(v => s += `<path d="M${g} ${y(v)}H${w - d}" stroke="var(--trait-2)" stroke-width="1.5"/>`);
  if (fut) {
    s += `<rect x="${g + iw + 5}" y="0" width="${fut - 5}" height="${h - bas}" fill="url(#${id})"/><path d="M${g + iw + 5} 0V${h - bas}" stroke="var(--cyan)" stroke-opacity=".45"/>`;
    if (fut >= 56) s += `<text x="${g + iw + fut / 2 + 3}" y="18" text-anchor="middle">Avenir</text>`;
  }
  if (o.barres) o.barres.forEach((v,i) => {
    const bw = Math.max(1,iw / n - 2);
    s += `<rect x="${x(i) - bw / 2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(v) - y(0)))}" fill="var(${v >= 0 ? '--m-gain' : '--m-perte'})" opacity=".7"/>`;
  });
  series.forEach((se,j) => {
    const p = chemin(se.v,x,y);
    if (j === 0 && o.aire) s += `<path d="${p}L${x(n - 1)},${h - bas}L${x(0)},${h - bas}Z" fill="${se.c}" opacity=".1"/>`;
    s += `<path d="${p}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round"/>`;
    const z = se.v.at(-1);
    if (z !== null && z !== undefined) s += `<circle cx="${x(n - 1)}" cy="${y(z)}" r="4" fill="${se.c}" stroke="var(--navy-900)" stroke-width="2"/>`;
  });
  if (o.dates !== false && o.ts) {
    const k = Math.max(1,Math.min(5,Math.floor(iw / 105)));
    for (let j = 0; j <= k; j++) {
      const i = Math.round(j * (n - 1) / k);
      s += `<text x="${x(i)}" y="${h - 6}" text-anchor="${j === 0 ? 'start' : j === k ? 'end' : 'middle'}">${o.ts.at(-1) - o.ts[0] > 180 ? DA.format(JOURS[o.ts[i]]) : dc(o.ts[i])}</text>`;
    }
  }
  poser(el,s,w,h,{g,iw,n,x,ligne:i => `<b>${o.ts ? dl(o.ts[i]) : ''}</b>` + series.map(se => `<p><span><i class="sw" style="--c:${se.c}"></i> ${se.nom}</span><span>${se.v[i] === null ? '–' : f(se.v[i])}</span></p>`).join('')});
}

/** Graphique de marché : bougies ou ligne, volume, moyennes, niveaux du joueur. */
function chandelles(el,sym,o){
  const w = el.clientWidth, h = el.clientHeight;
  if (w < 80 || h < 80) return;
  const id = 'h' + (++compteur), d = 64, g = 8, fut = Math.min(64,w * .12), bas = 22, vh = o.vol ? Math.min(58,h * .18) : 4;
  const iw = w - d - fut - g, n = Math.min(o.n,Math.floor(iw / 3.2),S.t + 1), deb = S.t - n + 1;
  const bs = DATA[sym].slice(deb,S.t + 1), tc = clotures(sym);
  const mm = [];
  if (o.ma20) mm.push(['MM 20',moyenne(tc,20).slice(deb),'var(--s3)']);
  if (o.ma50) mm.push(['MM 50',moyenne(tc,50).slice(deb),'var(--s2)']);
  let lo = Math.min(...bs.map(b => b.l)), hi = Math.max(...bs.map(b => b.h));
  mm.forEach(m => m[1].forEach(v => { if (v !== null) { lo = Math.min(lo,v); hi = Math.max(hi,v); } }));
  const marge = (hi - lo) * .07; lo -= marge; hi += marge;
  const pas = iw / n, x = i => g + (i + .5) * pas, ph = h - bas - vh - 12, y = v => 8 + (hi - v) / (hi - lo) * ph;
  let s = hachures(id);
  graduations(lo,hi,Math.max(3,Math.floor(ph / 55))).forEach(v => {
    s += `<path d="M0 ${y(v)}H${w - d}" stroke="var(--trait)"/><text x="${w - d + 7}" y="${y(v) + 4}">${fPx(v)}</text>`;
  });
  const fx = g + iw + 3;
  s += `<rect x="${fx}" y="0" width="${fut - 3}" height="${h - bas}" fill="url(#${id})"/><path d="M${fx} 0V${h - bas}" stroke="var(--cyan)" stroke-opacity=".45"/>`;
  if (fut >= 48) s += `<text x="${fx + fut / 2}" y="17" text-anchor="middle">Avenir</text>`;
  if (o.vol) {
    const mx = Math.max(...bs.map(b => b.v)), bw = Math.max(1,pas - 2);
    bs.forEach((b,i) => s += `<rect x="${x(i) - bw / 2}" y="${h - bas - b.v / mx * vh}" width="${bw}" height="${b.v / mx * vh}" fill="var(${b.c >= b.o ? '--m-gain' : '--m-perte'})" opacity=".32"/>`);
  }
  if (o.type === 'ligne') {
    const p = chemin(bs.map(b => b.c),x,y);
    s += `<path d="${p}L${x(n - 1)},${h - bas - vh}L${x(0)},${h - bas - vh}Z" fill="var(--cyan)" opacity=".07"/><path d="${p}" fill="none" stroke="var(--cyan)" stroke-width="2"/>`;
  } else {
    const bw = Math.max(1.6,Math.min(16,pas * .68));
    bs.forEach((b,i) => {
      const c = `var(${b.c >= b.o ? '--m-gain' : '--m-perte'})`, a = y(Math.max(b.o,b.c)), z = y(Math.min(b.o,b.c));
      s += `<path d="M${x(i)} ${y(b.h)}V${y(b.l)}" stroke="${c}"/><rect x="${x(i) - bw / 2}" y="${a}" width="${bw}" height="${Math.max(1,z - a)}" fill="${c}" rx=".7"/>`;
    });
  }
  mm.forEach(m => s += `<path d="${chemin(m[1],x,y)}" fill="none" stroke="${m[2]}" stroke-width="1.5"/>`);
  const p = S.pos[sym], r = S.regles[sym], niv = [];
  if (p) niv.push([p.moy,'Votre prix','var(--encre-2)']);
  if (p && r?.sl) niv.push([p.moy * (1 - r.sl / 100),'Stop-loss','var(--m-perte)']);
  if (p && r?.tp) niv.push([p.moy * (1 + r.tp / 100),'Objectif','var(--m-gain)']);
  S.ordres.filter(q => q.s === sym && q.statut === 'En attente').forEach(q => niv.push([q.niveau,q.type === 'limite' ? 'Limite' : 'Stop','var(--cyan)']));
  niv.forEach(([v,t,c]) => {
    if (v < lo || v > hi) return;
    s += `<path d="M0 ${y(v)}H${fx}" stroke="${c}" stroke-opacity=".8" stroke-dasharray="5 4"/><rect x="5" y="${y(v) - 17}" width="${t.length * 6.2 + 8}" height="15" fill="var(--navy-950)" rx="3"/><text class="fort" x="9" y="${y(v) - 5}">${t}</text>`;
  });
  const z = bs[n - 1].c;
  s += `<path d="M${x(n - 1)} ${y(z)}H${w - d}" stroke="var(--cyan)" stroke-dasharray="2 3"/><rect x="${w - d}" y="${y(z) - 10}" width="${d - 2}" height="20" rx="4" fill="var(--cyan)"/><text class="sur" x="${w - d + 6}" y="${y(z) + 4}">${fPx(z)}</text>`;
  const k = Math.max(1,Math.min(5,Math.floor(iw / 110)));
  for (let j = 0; j <= k; j++) {
    const i = Math.round(j * (n - 1) / k);
    s += `<text x="${x(i)}" y="${h - 6}" text-anchor="${j === 0 ? 'start' : j === k ? 'end' : 'middle'}">${dc(deb + i)}</text>`;
  }
  poser(el,s,w,h,{g,iw,n,x,ligne:i => {
    const b = bs[i];
    return `<b>${dl(deb + i)}</b>` + [['Ouverture',b.o],['Plus haut',b.h],['Plus bas',b.l],['Clôture',b.c]].map(([a,v]) => `<p><span>${a}</span><span>${fPx(v)}</span></p>`).join('')
      + mm.map(m => m[1][i] === null ? '' : `<p><span>${m[0]}</span><span>${fPx(m[1][i])}</span></p>`).join('');
  }});
}

function histogramme(el,valeurs,seuil){
  const w = el.clientWidth, h = el.clientHeight;
  if (w < 80 || !valeurs.length) return;
  const lo = Math.min(...valeurs,-.001), hi = Math.max(...valeurs,.001), n = 24, c = Array(n).fill(0);
  valeurs.forEach(v => c[Math.min(n - 1,Math.floor((v - lo) / (hi - lo) * n))]++);
  const mx = Math.max(...c), g = 12, iw = w - 24, pas = iw / n, x = i => g + (i + .5) * pas;
  let s = `<path d="M${g} ${h - 24}H${w - g}" stroke="var(--trait-2)"/>`;
  c.forEach((v,i) => {
    const queue = lo + (i + .5) / n * (hi - lo) <= seuil, bh = v / mx * (h - 64);
    s += `<rect x="${x(i) - pas / 2 + 1}" y="${h - 24 - bh}" width="${Math.max(1,pas - 2)}" height="${bh}" rx="2" fill="var(${queue ? '--m-perte' : '--s1'})"/>`;
  });
  const xs = g + (seuil - lo) / (hi - lo) * iw;
  s += `<path d="M${xs} 24V${h - 24}" stroke="var(--encre)"/><text class="fort" x="${xs + 6}" y="20">VaR 95 % : ${fP(-seuil)}</text><text x="${g}" y="${h - 6}">${fP(lo)}</text><text x="${w - g}" y="${h - 6}" text-anchor="end">${fSP(hi)}</text>`;
  poser(el,s,w,h,{g,iw,n,x,ligne:i => `<b>${fSP(lo + i / n * (hi - lo))} à ${fSP(lo + (i + 1) / n * (hi - lo))}</b><p><span>Séances</span><span>${c[i]}</span></p>`});
}

document.addEventListener('pointermove',e => {
  const el = e.target.closest?.('.plot');
  document.querySelectorAll('.plot').forEach(p => {
    if (p === el) return;
    p.querySelector('.viseur')?.setAttribute('hidden','');
    p.querySelector('.bulle')?.setAttribute('hidden','');
  });
  if (!el?._meta) return;
  const m = el._meta, r = el.getBoundingClientRect(), px = e.clientX - r.left;
  let i = 0, best = Infinity;
  for (let k = 0; k < m.n; k++) { const q = Math.abs(m.x(k) - px); if (q < best) { best = q; i = k; } }
  const v = el.querySelector('.viseur'), b = el.querySelector('.bulle');
  if (!v) return;
  v.hidden = b.hidden = false; v.style.left = m.x(i) + 'px'; b.innerHTML = m.ligne(i);
  const bw = b.offsetWidth, g = m.x(i) + 12;
  b.style.left = Math.max(4,g + bw > r.width ? m.x(i) - bw - 12 : g) + 'px';
});

const FORMATION = {"lecons":[{"id":"ordres","titre":"Passer ses premiers ordres","niveau":"Débutant","minutes":8,"resume":"Ordre au marché, ordre à cours limité, ordre stop, écart acheteur-vendeur.","sections":[{"titre":"Trois types d'ordres","texte":"Un ordre au marché s'exécute tout de suite au meilleur prix disponible : vous êtes sûr d'être exécuté, pas du prix. Un ordre à cours limité fixe le prix maximum d'achat (ou minimum de vente) : vous maîtrisez le prix, pas l'exécution. Un ordre stop reste dormant jusqu'à ce que le prix atteigne un seuil, puis se transforme en ordre au marché."},{"titre":"L'écart acheteur-vendeur","texte":"Il existe toujours deux prix : celui auquel on achète (vendeur, plus haut) et celui auquel on vend (acheteur, plus bas). L'écart est un coût caché payé à chaque aller-retour, plus important sur les actifs peu échangés. Les frais de courtage s'y ajoutent."}],"questions":[{"enonce":"Vous voulez acheter sans jamais payer plus de 50 $. Quel ordre ?","choix":["Au marché","À cours limité à 50 $","Stop à 50 $","Aucun, c'est impossible"],"bonne":1,"explication":"Le cours limité plafonne le prix d'achat ; en contrepartie, l'ordre peut ne jamais être exécuté."},{"enonce":"Un ordre stop de vente à 90 $ sur une action cotée 100 $ :","choix":["Vend immédiatement à 100 $","Se déclenche si le prix descend à 90 $","Se déclenche si le prix monte à 90 $","Garantit de vendre exactement à 90 $"],"bonne":1,"explication":"Il dort jusqu'à 90 $ puis devient un ordre au marché : en cas de trou de cotation (gap), l'exécution peut se faire sous 90 $."},{"enonce":"L'écart acheteur-vendeur est :","choix":["Un impôt","Un coût implicite payé à l'achat et à la vente","Un gain pour l'investisseur","Toujours nul sur les actions"],"bonne":1,"explication":"On achète au prix vendeur, on revend au prix acheteur : la différence est perdue à chaque aller-retour."}],"exercices":[{"texte":"Achetez 10 actions d'un titre de votre choix, puis posez un stop-loss à −10 %.","lien":"/actions","libelle":"Ouvrir les actions"}]},{"id":"risque","titre":"Gérer le risque","niveau":"Débutant","minutes":10,"resume":"Taille de position, stop-loss, diversification, profil de risque.","sections":[{"titre":"Perdre peu pour durer","texte":"Une perte de 50 % exige un gain de 100 % pour revenir à zéro : les grosses pertes sont asymétriques. Limiter la taille de chaque position et fixer à l'avance une sortie (stop-loss) protège le capital."},{"titre":"Diversifier","texte":"Des actifs qui ne montent pas et ne descendent pas ensemble réduisent le risque du portefeuille sans réduire proportionnellement le rendement attendu. La diversification n'élimine pas le risque de marché : dans une grande crise, beaucoup de corrélations montent vers 1."},{"titre":"Mesurer","texte":"La volatilité mesure l'agitation, le drawdown la pire baisse depuis un sommet, la VaR la perte qu'on ne dépasse pas sur un jour avec un certain niveau de confiance (95 % ici), historiquement. Ce sont des estimations du passé, pas des garanties."}],"questions":[{"enonce":"Après une perte de 50 %, quel gain faut-il pour revenir au point de départ ?","choix":["50 %","75 %","100 %","150 %"],"bonne":2,"explication":"Il reste 50 : pour retrouver 100, il faut le doubler, soit +100 %."},{"enonce":"La VaR à 95 % sur un jour de 3 % signifie :","choix":["On perdra 3 % chaque jour","Sur 20 jours, environ 1 jour devrait dépasser 3 % de perte (selon le passé)","La perte maximale possible est de 3 %","Le portefeuille gagne 95 % du temps"],"bonne":1,"explication":"C'est un seuil statistique : 5 % des jours dépassent la VaR, et rien ne borne la perte au-delà."},{"enonce":"Détenir dix actions technologiques américaines est-il bien diversifié ?","choix":["Oui, dix valeurs suffisent","Non, elles réagissent aux mêmes facteurs","Oui, si elles ont des noms différents","Cela dépend de leur prix"],"bonne":1,"explication":"Le nombre de lignes compte moins que leurs différences de secteur, de zone et de classe d'actifs."}],"exercices":[{"texte":"Répondez au questionnaire de risque, puis regardez si votre portefeuille reste dans votre tolérance.","lien":"/compte","libelle":"Définir mon profil"}]},{"id":"graphiques","titre":"Lire un graphique et ses indicateurs","niveau":"Intermédiaire","minutes":10,"resume":"Bougies, moyennes mobiles, RSI, MACD, bandes de Bollinger.","sections":[{"titre":"La bougie","texte":"Une bougie résume une période : ouverture, plus haut, plus bas, clôture. Son corps relie ouverture et clôture, ses mèches montrent les extrêmes atteints."},{"titre":"Les indicateurs","texte":"Une moyenne mobile lisse les prix : un prix au-dessus d'une moyenne longue suggère une tendance haussière. Le RSI (0 à 100) mesure la vigueur des hausses récentes ; au-dessus de 70 on parle de « suracheté », sous 30 de « survendu », sans que cela annonce un retournement. Le MACD compare deux moyennes pour repérer l'accélération d'une tendance. Les bandes de Bollinger entourent le prix de deux écarts-types : elles s'élargissent quand la volatilité monte."},{"titre":"Leur limite","texte":"Les indicateurs sont calculés sur le passé et réagissent avec retard. Un RSI « survendu » peut le rester longtemps dans une forte baisse."}],"questions":[{"enonce":"Un RSI à 80 signifie que :","choix":["Le prix va forcément baisser","Les hausses récentes ont été très fortes","L'action est chère pour toujours","Le volume est élevé"],"bonne":1,"explication":"Le RSI décrit la vigueur récente des hausses ; il n'annonce pas ce qui suit."},{"enonce":"Une moyenne mobile longue réagit :","choix":["Plus vite qu'une courte","Plus lentement qu'une courte","Exactement comme une courte","Seulement aux gros volumes"],"bonne":1,"explication":"Plus la fenêtre est longue, plus la moyenne est lisse et en retard."},{"enonce":"Des bandes de Bollinger qui s'écartent indiquent :","choix":["Une volatilité qui augmente","Un prix qui va monter","Un volume qui baisse","Une erreur de données"],"bonne":0,"explication":"Les bandes sont fondées sur l'écart-type des prix récents : plus il est grand, plus elles sont larges."}],"exercices":[{"texte":"Affichez les moyennes mobiles, le RSI et le MACD sur un titre et notez où ils se contredisent.","lien":"/actions","libelle":"Ouvrir un graphique"}]},{"id":"backtest","titre":"Tester une idée sans se tromper","niveau":"Intermédiaire","minutes":10,"resume":"Backtesting, coûts, surajustement, test hors échantillon.","sections":[{"titre":"Rejouer le passé","texte":"Un backtest applique une règle à l'historique. Pour être honnête, le signal du jour ne doit utiliser que des informations déjà connues, l'ordre s'exécute au jour suivant, et les coûts de transaction sont comptés."},{"titre":"Le piège du surajustement","texte":"Si vous testez beaucoup de réglages, l'un d'eux gagnera par hasard. Un bon résultat sur une période n'a de valeur que s'il se répète sur une autre : comparez les deux moitiés de l'historique et gardez la règle la plus simple."}],"questions":[{"enonce":"Pourquoi exécuter l'ordre le lendemain du signal ?","choix":["Pour économiser des frais","Parce que le signal utilise la clôture, qu'on ne connaît qu'une fois la séance finie","Parce que la bourse est fermée le week-end","Ce n'est pas nécessaire"],"bonne":1,"explication":"Acheter à la clôture qui a produit le signal supposerait de connaître cette clôture à l'avance."},{"enonce":"Sur 50 stratégies testées, la meilleure a battu le marché. Que faire ?","choix":["La déployer aussitôt","Se méfier : sur 50 essais, une peut gagner par chance","Tester 50 de plus","Ignorer les coûts"],"bonne":1,"explication":"C'est le risque de comparaison multiple : il faut confirmer hors de l'échantillon."},{"enonce":"Une stratégie gagne sur la première moitié et perd sur la seconde. C'est :","choix":["Un signe de robustesse","Un signe de fragilité","Sans importance","Une preuve de tendance"],"bonne":1,"explication":"Un résultat qui dépend de la période choisie est probablement dû au hasard ou à un régime de marché particulier."}],"exercices":[{"texte":"Comparez le croisement de moyennes et le RSI sur un titre : lequel gagne sur les deux moitiés ?","lien":"/strategies","libelle":"Ouvrir les stratégies"}]},{"id":"matieres","titre":"Les matières premières","niveau":"Intermédiaire","minutes":10,"resume":"Contrats à terme, chocs d'offre et de demande, prix négatif du pétrole.","sections":[{"titre":"Des contrats plutôt que des barils","texte":"Les investisseurs échangent des contrats à terme : l'engagement d'acheter ou de vendre une quantité à une date et un prix fixés. Quand l'échéance approche, on « roule » le contrat vers le suivant, ce qui peut coûter ou rapporter selon l'écart de prix entre les échéances."},{"titre":"Chocs et saisons","texte":"L'offre des matières premières dépend de la météo, de la géopolitique et des décisions des producteurs ; la demande, de la conjoncture. Le pétrole et le gaz réagissent aux tensions internationales, les céréales aux récoltes, l'or à l'incertitude."},{"titre":"Quand le prix devient négatif","texte":"En avril 2020, le contrat américain de pétrole WTI a clôturé sous zéro : la demande s'était effondrée, le stockage était saturé, et les détenteurs de contrats proches de l'échéance devaient payer pour ne pas recevoir de livraison. Un prix négatif est donc possible pour un actif physique difficile à stocker, et les rendements en pourcentage y perdent leur sens."}],"questions":[{"enonce":"Pourquoi le prix du WTI a-t-il pu devenir négatif en avril 2020 ?","choix":["Erreur d'affichage","Stockage saturé et demande effondrée près de l'échéance","Le pétrole était devenu gratuit","Décision de la banque centrale"],"bonne":1,"explication":"Les détenteurs du contrat à échéance prochaine ne voulaient pas de livraison physique et payaient pour s'en défaire."},{"enonce":"Une sécheresse sévère fait en général :","choix":["Baisser les cours des céréales","Monter les cours des céréales","Monter le pétrole uniquement","Ne rien changer"],"bonne":1,"explication":"Une offre plus faible, à demande égale, pousse les prix à la hausse."},{"enonce":"« Rouler » un contrat à terme signifie :","choix":["Le revendre et acheter l'échéance suivante","Le convertir en actions","Le garder jusqu'à la livraison","L'annuler sans frais"],"bonne":0,"explication":"On évite la livraison physique en remplaçant le contrat proche par un contrat plus lointain."}],"exercices":[{"texte":"Regardez le WTI en avril 2020 sur la frise du temps : que remarquez-vous sur le graphique ?","lien":"/matieres","libelle":"Ouvrir les matières premières"}]},{"id":"credit","titre":"Risque de crédit : score Z et probabilité de défaut","niveau":"Avancé","minutes":12,"resume":"Score Z d'Altman, probabilité de défaut, lecture des contributions.","sections":[{"titre":"Le score Z","texte":"Altman a combiné cinq ratios du bilan (fonds de roulement, bénéfices non distribués, rentabilité, capitaux propres sur dettes, rotation des actifs) en un score. Au-dessus de 2,99, l'entreprise est jugée saine ; sous 1,81, en zone de détresse ; entre les deux, la zone grise. C'est un repère statistique ancien, calé sur des entreprises industrielles américaines."},{"titre":"La probabilité de défaut","texte":"Un modèle statistique estime la chance qu'un emprunteur ne rembourse pas. Dans une régression logistique, chaque variable pousse le « log des chances » vers le haut ou le bas : on peut donc expliquer précisément un résultat. Un bon modèle classe bien les emprunteurs (AUC) et ses probabilités sont calibrées (10 % prédit correspond à environ 10 % observé)."}],"questions":[{"enonce":"Un score Z de 1,5 (version 1968) place l'entreprise en :","choix":["Zone saine","Zone grise","Zone de détresse","Zone hors score"],"bonne":2,"explication":"Sous 1,81, le modèle classe l'entreprise parmi celles qui ressemblent aux faillies du jeu d'origine."},{"enonce":"Une AUC de 0,5 signifie :","choix":["Un modèle parfait","Un classement au hasard","50 % de défauts","Un modèle calibré"],"bonne":1,"explication":"L'AUC est la chance de classer un défaut au-dessus d'un non-défaut : 0,5 correspond au hasard."},{"enonce":"Pourquoi une régression logistique est-elle facile à expliquer ?","choix":["Elle est toujours la plus précise","Chaque variable ajoute une contribution exacte au log des chances","Elle n'utilise pas de données","Elle ne se trompe jamais"],"bonne":1,"explication":"Le résultat est une somme de contributions : on voit ce qui a fait monter ou baisser le risque."}],"exercices":[{"texte":"Calculez le score d'une entreprise en zone grise puis améliorez un ratio pour la faire passer en zone saine.","lien":"/credit","libelle":"Ouvrir le risque de crédit"}]},{"id":"banques","titre":"Banques conventionnelles et islamiques face aux chocs","niveau":"Avancé","minutes":12,"resume":"CET1, stress tests, mourabaha, salam, istisna, risque commercial déplacé.","sections":[{"titre":"Le ratio de fonds propres","texte":"Le ratio CET1 compare les fonds propres de meilleure qualité aux actifs pondérés des risques. Bâle III exige au moins 4,5 %, plus un coussin de conservation de 2,5 %, soit 7 %. Un test de résistance applique un choc et regarde où tombe le ratio."},{"titre":"Finance islamique","texte":"La finance islamique interdit l'intérêt et s'adosse à des actifs réels. En mourabaha, la banque achète un bien puis le revend au client avec une marge connue, payable à terme. En salam, elle paie d'avance une marchandise livrée plus tard. En istisna, elle finance la fabrication d'un bien. Les déposants en comptes d'investissement partagent les pertes, mais la banque en absorbe souvent une partie pour éviter les retraits : c'est le risque commercial déplacé."}],"questions":[{"enonce":"En mourabaha, quand la banque est-elle exposée au prix de la marchandise ?","choix":["Jamais","Tant qu'elle détient le bien en stock avant de le revendre","Seulement après la vente","Uniquement en cas de salam"],"bonne":1,"explication":"Entre l'achat et la revente, la banque porte le risque de variation du prix du bien."},{"enonce":"Le « risque commercial déplacé » désigne :","choix":["Un risque de change","Des pertes que la banque absorbe à la place des déposants pour les retenir","Un risque de fraude","Un impôt spécifique"],"bonne":1,"explication":"Elle renonce à une part de sa rémunération pour lisser le rendement des déposants, ce qui pèse sur ses fonds propres."},{"enonce":"Un CET1 de 6 % pour une banque soumise au coussin de conservation :","choix":["Respecte tous les seuils","Est au-dessus du minimum de 4,5 % mais sous 7 %","Est sous le minimum","N'a pas de sens"],"bonne":1,"explication":"Au-dessus de 4,5 % mais sous 7 %, la banque entame son coussin de conservation et voit ses distributions restreintes."}],"exercices":[{"texte":"Appliquez un choc de −30 % sur l'énergie et comparez les banques conventionnelles et islamiques.","lien":"/stress","libelle":"Ouvrir les stress tests"}]},{"id":"assurance","titre":"Assurance : prime et provisions","niveau":"Avancé","minutes":10,"resume":"Fréquence, coût moyen, prime pure et commerciale, Chain Ladder.","sections":[{"titre":"Calculer une prime","texte":"La prime pure est le coût moyen attendu du contrat : fréquence des sinistres multipliée par leur coût moyen. La prime commerciale y ajoute une marge de sécurité (pour l'aléa) et les frais de gestion. La probabilité d'au moins un sinistre sur une durée est 1 moins l'exponentielle de moins fréquence fois durée."},{"titre":"Provisionner","texte":"Une assurance doit mettre de côté de quoi régler des sinistres déjà survenus mais pas encore payés. Le Chain Ladder observe comment les règlements d'une année de survenance grossissent d'une année à l'autre, et applique ces facteurs aux années encore incomplètes."}],"questions":[{"enonce":"Fréquence 0,10 par an et coût moyen 2 000 € : la prime pure annuelle vaut :","choix":["20 €","200 €","2 000 €","20 000 €"],"bonne":1,"explication":"0,10 × 2 000 = 200 €."},{"enonce":"La prime commerciale est :","choix":["Égale à la prime pure","Inférieure à la prime pure","La prime pure plus marge et frais","Sans rapport avec la prime pure"],"bonne":2,"explication":"Elle couvre le coût attendu, une marge de sécurité et les frais de l'assureur."},{"enonce":"Dans un triangle de règlements, les cases manquantes (en bas à droite) représentent :","choix":["Des erreurs de saisie","Les règlements futurs à estimer","Des sinistres refusés","Des primes impayées"],"bonne":1,"explication":"Ces règlements n'ont pas encore eu lieu : le Chain Ladder les estime."}],"exercices":[{"texte":"Calculez la prime d'un conducteur de 22 ans puis celle d'un conducteur de 55 ans.","lien":"/actuariat","libelle":"Ouvrir l'actuariat"}]}],"seuil":0.7,"pieges":[{"id":"concentration","titre":"Tout dans le même panier","situation":"Léa investit 10 000 $ et pense avoir bien réparti son portefeuille.","tableau":{"entetes":["Actif","Poids"],"lignes":[["Tesla","62 %"],["Apple","14 %"],["Bitcoin","10 %"],["Or","8 %"],["Liquidités","6 %"]]},"question":"Quelle est l'erreur principale ?","choix":[{"texte":"Elle garde trop de liquidités","explication":"6 % de liquidités, c'est raisonnable : cela permet de saisir des occasions et d'amortir un choc."},{"texte":"Une seule action pèse 62 % du portefeuille","explication":"Exact. Si Tesla perd 40 %, le portefeuille perd environ 25 % à cause de cette seule ligne (0,62 × 40 %)."},{"texte":"Elle détient de l'or","explication":"L'or peut au contraire diversifier : il ne bouge pas toujours comme les actions."},{"texte":"Elle a acheté du Bitcoin","explication":"Ce n'est pas l'actif le problème, c'est la taille : ici 10 %, ce qui reste mesuré."}],"piege":1,"retenir":"Aucune position ne devrait, à elle seule, pouvoir ruiner le portefeuille."},{"id":"moyenne","titre":"Se rattraper à tout prix","situation":"Karim a acheté une action à 100 $. Elle tombe à 70 $, sans aucune nouvelle. Il décide d'acheter deux fois plus pour « se rattraper ».","question":"Quelle est l'erreur ?","choix":[{"texte":"Il aurait dû vendre à 99 $","explication":"Facile à dire après coup. Personne ne sait à l'avance où une baisse s'arrête."},{"texte":"Il double sa mise sur une position perdante sans avoir réexaminé sa raison d'acheter","explication":"Exact. Renforcer peut se défendre si la thèse est intacte et si la taille était prévue. Ici la décision est émotionnelle : on augmente le risque pour effacer une perte."},{"texte":"Il aurait dû attendre le lendemain","explication":"Attendre un jour ne change rien à la qualité de la décision."},{"texte":"Acheter après une baisse est toujours interdit","explication":"Faux : c'est parfois une bonne occasion. Tout dépend de la raison et de la taille."}],"piege":1,"retenir":"Une perte passée n'est pas une raison d'acheter. Décidez comme si vous partiez d'une feuille blanche."},{"id":"frais","titre":"Le gain qui n'en est pas un","situation":"Sam passe 30 ordres en deux jours et se félicite : son portefeuille a gagné.","tableau":{"entetes":["Mesure","Valeur"],"lignes":[["Gain avant frais","+1,2 %"],["Frais et écart achat-vente","−1,5 %"],["Résultat réel","−0,3 %"]]},"question":"Quelle est l'erreur de Sam ?","choix":[{"texte":"Il compte son gain avant les frais","explication":"Exact. Chaque ordre coûte des frais et un écart achat-vente. Avec beaucoup d'ordres, ils dépassent souvent le gain."},{"texte":"Il n'a pas assez diversifié","explication":"Le tableau ne dit rien de la diversification : le problème est ailleurs."},{"texte":"Il a vendu trop tard","explication":"Rien n'indique cela. Le tableau montre un résultat net négatif à cause des coûts."},{"texte":"Il a choisi un mauvais jour","explication":"Le jour n'explique pas un résultat qui devient négatif une fois les coûts comptés."}],"piege":0,"retenir":"Ce qui compte, c'est le résultat après frais. Plus on trade, plus les coûts pèsent."},{"id":"stop","titre":"Le stop qui saute tout de suite","situation":"Inès achète une action qui bouge en moyenne de 3 % par jour. Elle place son stop-loss à 0,5 % sous son prix d'achat.","question":"Quelle est l'erreur ?","choix":[{"texte":"Un stop-loss est toujours inutile","explication":"Faux : bien placé, il limite la perte et évite de décider dans l'émotion."},{"texte":"Son stop est plus serré que les mouvements normaux du prix","explication":"Exact. Une variation de 0,5 % arrive plusieurs fois par jour : elle sera sortie par le « bruit », sans que sa thèse soit fausse. On règle un stop selon la volatilité."},{"texte":"Elle aurait dû mettre son stop à 50 %","explication":"Trop large, il ne protégerait plus rien. Le bon niveau tient compte de la volatilité, ni trop serré ni trop loin."},{"texte":"Les stops ne fonctionnent que sur les cryptomonnaies","explication":"Faux : ils s'utilisent sur tous les actifs négociés."}],"piege":1,"retenir":"Réglez le stop au-delà du bruit habituel du prix, et pensez à la perte maximale acceptée."},{"id":"fausse-diversification","titre":"La diversification en trompe-l'œil","situation":"Yanis détient cinq grandes entreprises, 20 % chacune, et se dit bien diversifié.","tableau":{"entetes":["Actif","Secteur","Pays"],"lignes":[["Apple","Technologie","États-Unis"],["Microsoft","Technologie","États-Unis"],["Nvidia","Technologie","États-Unis"],["Alphabet","Technologie","États-Unis"],["Amazon","Technologie","États-Unis"]]},"question":"Où est l'erreur ?","choix":[{"texte":"Cinq positions, c'est trop peu","explication":"Le nombre n'est pas le vrai problème : ce qui compte, c'est que les positions bougent différemment."},{"texte":"Les grandes entreprises sont trop risquées","explication":"Pas en soi. Le défaut ici est que toutes se ressemblent."},{"texte":"Elles sont du même secteur et du même pays : elles montent et baissent souvent ensemble","explication":"Exact. Compter les lignes ne suffit pas : des actifs très corrélés se comportent comme un seul gros pari. Regardez la page Portefeuille, onglet corrélations."},{"texte":"20 % chacune, c'est trop équilibré","explication":"Une répartition égale n'est pas un défaut."}],"piege":2,"retenir":"Diversifier, c'est mélanger des actifs qui ne réagissent pas pareil, pas multiplier les lignes."},{"id":"fomo","titre":"La peur de rater le train","situation":"Un actif vient de gagner 40 % en trois jours et tout le monde en parle. Nour y met la moitié de son capital, sans plan de sortie.","question":"Quelle est l'erreur ?","choix":[{"texte":"Elle aurait dû acheter avant la hausse","explication":"Impossible à savoir à l'avance. Le jugement après coup n'aide pas à décider."},{"texte":"Acheter un actif qui a monté est interdit","explication":"Faux : une tendance peut continuer. Ce n'est pas l'achat qui pose problème."},{"texte":"Elle aurait dû y mettre tout son capital","explication":"Cela aggraverait le risque, pas l'inverse."},{"texte":"Elle achète par peur de rater le mouvement, avec une grosse mise et sans plan de sortie","explication":"Exact. Trois signaux d'alerte : la décision vient de la foule, la taille est démesurée, et rien n'est prévu si le prix retombe."}],"piege":3,"retenir":"Avant d'acheter, écrivez la taille, le niveau de sortie et la raison. Si vous ne pouvez pas, n'achetez pas."}]};

  for (let y = 2015; y <= 2026; y++) {
    ca[y] = ca23 * (1 + croissance) ** (y - 2023) * (.95 + r() * .1);
    marge[y] = marge0 * (.82 + r() * .3) * (y === 2020 ? .8 : 1);
  }
  for (let y = an - 4; y <= an; y++) ans.push({y,ca:ca[y],m:marge[y],rn:ca[y] * marge[y]});
  // BPA inventé, fixé à partir du cours de clôture de l'exercice déjà publié
  const tc = indexDate(Math.max(an,2018) + '-12-31'), bpa = DATA[s][tc].c / (pe * (.9 + .2 * (an % 3) / 2));
  return {an,ans,bpa,pe:prix(s) / bpa,ref:pe,marge:marge[an],cr:(ca[an] / ca[an - 4]) ** .25 - 1,dette:dette0,roe:borner(marge[an] * (1.1 + dette0) / 1.2,.02,.6)};
}
function valeurDCF(bpa,g,r,sortie){
  let v = 0, e = bpa;
  for (let i = 1; i <= 5; i++) { e *= 1 + g; v += e / (1 + r) ** i; }
  return v + e * sortie / (1 + r) ** 5;
}

const LEX_P = {hausse:1,rebond:1,record:2,solide:1,solides:1,croissance:1,accord:1,confiance:1,dépasse:1,bondit:2,optimisme:1,succès:1,relance:1,gains:1,profit:1,monte:1,bénéfices:1};
const LEX_N = {baisse:1,chute:2,crainte:1,craintes:1,crise:2,perte:1,pertes:1,faillite:2,récession:2,guerre:2,panique:2,menace:1,ralentissement:1,incertitude:1,fraude:2,sanctions:1,krach:2,inquiétudes:1};
/** Même règle que scenarios/sentiment.py : lexique, mots forts comptés double, négation inversée. */
function analyserTexte(txt){
  let p = 0, n = 0;
  const bruts = String(txt).split(/([^\p{L}]+)/u), vus = [];
  const html = bruts.map(m => {
    const w = m.toLowerCase();
    if (!/\p{L}/u.test(m)) return esc(m);
    const a = LEX_P[w] || 0, b = LEX_N[w] || 0, nie = vus.slice(-3).some(x => ['pas','ne','n','sans','jamais','aucune','aucun'].includes(x));
    vus.push(w);
    if (!a && !b) return esc(m);
    const bon = !!a !== nie;
    if (bon) p += a || b; else n += a || b;
    return `<mark class="${bon ? 'g' : 'l'}">${esc(m)}</mark>`;
  }).join('');
  return {v:(p - n) / (p + n + 1),html,p,n};
}
const TITRES = {
  p:['dépasse les attentes, la confiance revient','bondit après des annonces solides','porté par un accord et un regain d’optimisme','signe un rebond, la demande reste en croissance'],
  n:['en baisse, craintes de ralentissement','chute sur fond de récession possible','pénalisé par l’incertitude et des menaces de sanctions','recule, inquiétudes sur la demande'],
  o:['stable dans des échanges calmes','attendu avant la prochaine réunion de la banque centrale','sans direction claire en séance']};
const SOURCES = ['Presse financière','Réseaux sociaux','Analystes','Communiqués'];
function nouvellesDu(s,t){
  const r = alea(graineDe(s) + t * 7919);
  if (r() > .42) return null;
  const tend = prix(s,t) / prix(s,Math.max(0,t - 5)) - 1 + normale(r) * .025, k = tend > .009 ? 'p' : tend < -.009 ? 'n' : 'o';
  const titre = `${PAR_S[s].nom} ${TITRES[k][Math.floor(r() * TITRES[k].length)]}`;
  return {t,titre,src:SOURCES[Math.floor(r() * SOURCES.length)],...analyserTexte(titre)};
}
function sentiment(s){
  const jours = 120, marge = 20, brut = [];
  for (let t = Math.max(5,S.t - jours - marge); t <= S.t; t++) brut.push({t,n:nouvellesDu(s,t)});
  const serie = [];
  for (let i = marge; i < brut.length; i++) {
    const f = brut.slice(i - marge,i + 1).map(x => x.n).filter(Boolean);
    serie.push({t:brut[i].t,v:f.length ? 50 + moy(f.map(x => x.v)) * 50 : 50});
  }
  const news = brut.map(x => x.n).filter(Boolean).reverse(), recent = news.filter(x => x.t >= S.t - marge);
  const part = f => recent.length ? recent.filter(f).length / recent.length : 0;
  return {v:serie.at(-1).v,serie,news,recent,pos:part(x => x.v > .15),neg:part(x => x.v < -.15)};
}
const motSentiment = v => v < 30 ? 'Peur marquée' : v < 45 ? 'Prudence' : v < 56 ? 'Neutre' : v < 71 ? 'Optimisme' : 'Euphorie';

}

const interpoler = (pts,u) => {
  const i = Math.max(1,pts.findIndex(p => p[0] >= u)), [a,x] = pts[i - 1], [b,y] = pts[i];
  return x + (y - x) * (u - a) / (b - a || 1);
};
function creerPartie(id,diff){
  const choisi = FILMS.find(f => f.id === id), mystere = id === 'mystere';
  const f = mystere ? FILMS[Math.floor(Math.random() * 4)] : choisi;
  const a = Date.parse(f.debut), z = Date.parse(f.fin), au = d => Math.round((Date.parse(d) - a) / (z - a) * (JEU_PAS - 1));
  const anonymes = {actions:'Actions',coeur:'Secteur du scénario',refuge:'Métal refuge',sur:'Valeur sûre'};
  const px = f.actifs.map(([nom,role,pts],k) => {
    const r = alea(graineDe(f.id) + k * 13), v = [];
    for (let i = 0; i < JEU_PAS; i++) v.push(interpoler(pts,i / (JEU_PAS - 1)) * (1 + (i && i < JEU_PAS - 1 ? normale(r) * (role === 'sur' ? .002 : .009) : 0)));
    return {nom:mystere ? anonymes[role] : nom,role,v};

  const q = px.map(x => ({actions:.4,coeur:.2,refuge:.1,sur:.1})[x.role] * JEU_DEPOT / x.v[0]);
  return {id,f,mystere,diff,d:DIFFICULTES[diff],px,q,cash:JEU_DEPOT * .2,q0:[...q],i:0,hist:[JEU_DEPOT],frais:0,choix:[],actes:[],
    arrets:f.arrets.map(au),scenes:f.scenes.map(([d,t]) => [au(d),t]),etat:'rideau',compte:3,sel:px.findIndex(x => x.role === 'actions'),
    quand:i => mystere ? `Plan ${i + 1} sur ${JEU_PAS}` : DL.format(a + (z - a) * i / (JEU_PAS - 1)),peur:8,devine:null};
}
const jValeur = (g = G) => g.cash + g.q.reduce((x,q,k) => x + q * g.px[k].v[g.i],0);
const jTemoin = (g,i = g.i) => JEU_DEPOT * .2 + g.q0.reduce((x,q,k) => x + q * g.px[k].v[i],0);

  const v = g.px.find(x => x.role === 'coeur').v, pic = Math.max(...v.slice(0,g.i + 1));
  const choc = g.i > 2 ? Math.max(0,1 - v[g.i] / v[g.i - 3]) : 0;
  return borner(6 + (1 - v[g.i] / pic) * 105 + choc * 170,0,100);
}
function jAcheter(k,montant){
  const m = Math.min(montant,G.cash); if (m < 1) return false;
  const brut = m / (1 + G.d.frais);
  G.cash -= m; G.frais += m - brut; G.q[k] += brut / G.px[k].v[G.i];
  return true;
}
function jVendre(k,part){
  const brut = G.q[k] * part * G.px[k].v[G.i]; if (brut < 1) return false;

let jTimer = null, jBoucle = null, jAudio = null;
function bip(f = 440,d = .12,vol = .05){

function jPlanifier(){

  for (let i = p0; i <= fin; i += 4) { a.push(INDICE[i]); xx.push(i); }
  a.push(INDICE[S.t]); xx.push(fin);
  const lo = Math.min(...a), hi = Math.max(...a);
  peindre('f-svg',`<path d="${chemin(a,i => (xx[i] - p0) / (N - 1 - p0) * 1000,v => 25 - (v - lo) / (hi - lo || 1) * 20)}" fill="none" stroke="#18C3B8" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`);
  const reste = (1 - (fin - p0) / (N - 1 - p0)) * 100;
  $('#f-fut').style.width = reste + '%'; $('#f-fut').hidden = reste === 0;
  $('#f-xai').hidden = U.page === 'assistant';
  document.body.classList.toggle('en-jeu',U.page === 'simulation' && U.sTab === 'jeu' && !!G && G.etat !== 'fin');
}
function maj(){
  if (!PAGES[U.page]) return;
  majCoquille();
  suivreDefi();
  PAGES[U.page].maj();
}
function monter(){
  $('#vue').innerHTML = PAGES[U.page].html();
  if (U.page === 'marche') quantiteParDefaut();
  maj();
}
function route(){
  const h = location.hash.slice(1), p = PAGES[h] ? h : 'marque';
  if (U.page !== p) PAGES[U.page]?.quitter?.();
  U.page = p; fermer();
  $('#marque').hidden = p !== 'marque'; $('#app').hidden = p === 'marque';
  document.title = p === 'marque' ? 'Séance, identité et prototype' : `${PAGES[p].nom} · Séance`;
  if (p === 'marque') { pause(); document.body.classList.remove('en-jeu'); return; }
  if (p === 'simulation' && U.sTab === 'jeu' && G) pause();
  document.querySelectorAll('[data-page]').forEach(n => n.dataset.page === p ? n.setAttribute('aria-current','page') : n.removeAttribute('aria-current'));
  document.querySelector('.nav.plus').toggleAttribute('data-actif',['analyse','stress','formation','actuariat','assistant'].includes(p));
  monter(); dessinerChat(); $('#vue').scrollTop = 0;
}

/* ---------- temps ---------- */
function avancer(n = 1){
  if (S.direct) return;
  for (let i = 0; i < n; i++) seanceSuivante().forEach(e => annoncer(e));
  if (S.t >= N - 1) pause();
  maj();
}
function pause(){
  clearInterval(minuterie); minuterie = null;
  if (PAGES[U.page]) majCoquille();
}
function lecture(){
  if (S.direct || S.t >= N - 1) return;
  clearInterval(minuterie);
  minuterie = setInterval(() => avancer(1),1200 / vitesse);
  majCoquille();
}

/* ---------- mode Direct : compte séparé, flux simulé ---------- */
let replay = null, compteDirect = null, tiqueur = null;
function basculerDirect(oui){
  if (oui === S.direct) return;
  pause(); clearInterval(tiqueur);
  if (oui) {
    replay = S;
    if (compteDirect) S = compteDirect; else { initialiser(N - 100,N - 1); S.direct = true; compteDirect = S; }
    tiqueur = setInterval(tiquer,2000);
  } else { compteDirect = S; S = replay; replay = null; }
}
function tiquer(){
  ACTIFS.filter(a => a.cl === 'Crypto').forEach(a => {
    const b = DATA[a.s][N - 1];
    b.c *= 1 + (Math.random() - .5) * .0025; b.h = Math.max(b.h,b.c); b.l = Math.min(b.l,b.c);
    if (a.s === 'BTC') REFS.BTC.v[N - 1] = b.c;
  });
  noterValeur();
  if (['dashboard','marche','portefeuille'].includes(U.page)) maj();
}
function dialogueDates(erreur = ''){
  pause();
  if (S.direct) return ouvrir('<h2>Le Direct suit la date d’aujourd’hui</h2><p class="d2">Repassez en rejeu pour choisir une date entre 2019 et aujourd’hui.</p><div class="acts"><button class="btn" data-a="fermer">Fermer</button><button class="btn p" data-a="regime" data-v="rejeu">Passer en rejeu</button></div>');
  ouvrir(`<h2>Changer la date</h2><p class="d2">De janvier 2019 à aujourd’hui.</p>
    <label class="field">Date<input class="input" type="date" id="d-cible" min="${DATE_MIN}" max="${AUJOURDHUI}" value="${isoJour(S.t)}"></label>
    <div class="raccourcis">${[['2019-01-02','Début 2019'],['2020-02-14','Avant le Covid'],['2022-01-03','Début 2022'],['2023-03-10','Faillite SVB'],['2024-01-02','Début 2024'],[AUJOURDHUI,'Aujourd’hui']].map(([d,l]) => `<button class="btn mini" data-a="dRapide" data-v="${d}">${l}</button>`).join('')}</div>
    <p class="note calme" id="d-effet"></p>${erreur ? `<p class="note" role="alert">${erreur}</p>` : ''}
    <div class="acts"><button class="btn" data-a="dDemarrer">Démarrer une simulation ici</button><button class="btn p" id="d-aller" data-a="dAller">Avancer jusqu’ici</button></div>`);
  effetDate();
}
function effetDate(){
  const d = $('#d-cible').value, valide = d >= DATE_MIN && d <= AUJOURDHUI, t = valide ? indexDate(d) : -1;
  $('#d-aller').disabled = !valide || t <= S.t;
  $('#d-effet').textContent = !valide ? 'Choisissez une date entre le 1 janv. 2019 et le 22 nov. 2026.' : t > S.t ? `Avancer garde votre portefeuille et joue ${t - S.t} séances. Démarrer ici repart avec 100 000 USD.` : t < S.t ? 'Revenir en arrière recommence une simulation avec 100 000 USD : on ne trade pas en connaissant la suite.' : 'Vous êtes déjà à cette date.';
}

/* ---------- superpositions ---------- */
let retourFocus = null, enAttente = null;
function annoncer(t,err){
  const p = document.createElement('p');
  p.textContent = t; if (err) p.className = 'err';
  $('#toast').append(p);
  while ($('#toast').children.length > 3) $('#toast').firstChild.remove();
  setTimeout(() => p.remove(),4200);
}
function ouvrir(html,classe = ''){
  retourFocus = document.activeElement;
  $('#couche').innerHTML = `<div class="voile" data-fond><div class="dialogue ${classe}" role="dialog" aria-modal="true" aria-label="Séance">${html}</div></div>`;
  ($('#couche [autofocus]') || $('#couche input') || $('#couche button'))?.focus();
}
function fermer(){
  if (!$('#couche').firstChild) return;
  $('#couche').innerHTML = ''; enAttente = null;
  if (retourFocus?.isConnected) retourFocus.focus({preventScroll:true});
}
function confirmer(d){
  pause(); enAttente = d;
  const achat = d.sens === 'achat', l = (a,b,c = '') => `<p class="${c}"><span>${a}</span><b>${b}</b></p>`;
  ouvrir(`<h2>${achat ? 'Confirmer l’achat' : 'Confirmer la vente'}</h2><div>${actif(d.s)}</div><div class="recap">
    ${l('Type',{marche:'Au marché',limite:'Limite',stop:'Stop'}[d.type])}${l('Quantité',fQ(d.q))}${l('Prix estimé',fPx(d.ref) + ' USD')}${l('Frais',fM(d.f) + ' USD')}
    ${l(achat ? 'Total à payer' : 'Net à recevoir',fM(d.total) + ' USD','total')}${l('Disponible après',fM(achat ? disponible() - d.total : disponible() + (d.type === 'marche' ? d.total : 0)) + ' USD')}
    ${d.sl ? l('Stop-loss','−' + d.sl + ' %, perte visée ' + fM0(d.q * d.ref * d.sl / 100) + ' USD') : ''}${d.tp ? l('Objectif','+' + d.tp + ' %') : ''}</div>
    <p class="aide">Argent virtuel. Le temps est en pause pendant la confirmation.</p>
    <div class="acts"><button class="btn" data-a="fermer" autofocus>Annuler</button><button class="btn ${achat ? 'p' : 'v'}" data-a="valider">${achat ? 'Acheter' : 'Vendre'} ${fQ(d.q)} ${d.s}</button></div>`);
}
function expliquer(k){
  const b = bilan(), r = risque();
  const E = {
    valeur:['Valeur totale','Ce que vaudrait votre portefeuille si vous comptiez tout au dernier cours.',`${fM(S.cash)} liquidités + ${fM(b.investi)} positions = ${fM(b.total)} USD`,'Les frais d’une vente future ne sont pas déduits.'],
    risque:['Niveau de risque','Cinq indicateurs notés sur 100, une moyenne pondérée, puis un plancher de sécurité.',r.familles.map(f => `${f.nom} : ${F0.format(f.note)} × ${fP(f.w,0)} = ${F1.format(f.pts)}`).join('<br>') + `<br>Score : ${F1.format(r.score)} / 100`,'Au-dessus de 33 : modéré. Au-dessus de 67 : élevé. Un indicateur à 83 ou plus impose Élevé. Seuils pédagogiques, proposition à valider.'],
    retour:['Total return','Tout ce que vous avez gagné ou perdu depuis le début de la simulation : latent, réalisé, frais et assurance.',`${fM0(b.total)} ÷ ${fM0(CAPITAL)} − 1 = ${fSP(b.perf,2)}`,'Les dividendes ne sont pas modélisés dans la maquette.'],
    var:['VaR 95 %','La perte qu’un jour sur 20 a dépassée dans le passé, avec vos poids actuels.',`${fP(r.v95,2)} × ${fM0(b.total)} = ${fM0(r.v95 * b.total)} USD`,'Ce n’est pas une perte maximale.'],
    cvar:['CVaR 95 %','La perte moyenne des journées pires que la VaR.',`CVaR = ${fP(r.cvar,2)}`,'Elle repose sur peu de journées extrêmes.'],
    vol:['Volatilité','L’amplitude habituelle des variations, ramenée à un an.',`Écart-type journalier × √252 = ${fP(r.vol)}`,'Elle compte les hausses comme les baisses.'],
    dd:['Pire baisse','La plus forte chute entre un sommet et le creux qui suit.',`1 − creux ÷ sommet = ${fP(r.dd)}`,'Elle dépend de la période observée.'],
    carnet:['Carnet d’ordres','Les prix et quantités proposés à l’achat et à la vente.','Écart = meilleur vendeur − meilleur acheteur','Ce carnet est fabriqué pour la simulation. Cliquez un niveau pour préremplir une limite.'],
    rsi:['RSI 14','Il mesure si les hausses récentes dominent les baisses.','RSI = 100 × hausses ÷ (hausses + baisses)','Il peut rester au-dessus de 70 pendant une longue tendance.'],
    macd:['MACD','Il mesure l’accélération de la tendance.','MACD = EMA 12 − EMA 26 ; signal = EMA 9 du MACD','Il réagit avec retard.'],
    corr:['Corrélation','Elle indique si deux actifs bougent dans le même sens.','De −1 (opposés) à +1 (ensemble)','Elle augmente souvent pendant les crises.'],
    cet1:['Ratio CET1','Le capital le plus solide d’une banque, rapporté à ses actifs pondérés par le risque.','(capital − pertes de tous les canaux) ÷ actifs pondérés','Actifs pondérés supposés constants.']
  }[k];
  ouvrir(`<h2>${E[0]}</h2><p>${E[1]}</p><p class="formule">${E[2]}</p><p class="aide" style="display:block">${E[3]}</p><div class="acts"><button class="btn p" data-a="fermer">Compris</button></div>`);
}
let choixPalette = 0;
function chercher(){
  choixPalette = 0;
  ouvrir('<input class="input" id="k-q" placeholder="Actif ou page" aria-label="Chercher" autocomplete="off"><div class="res" id="k-r"></div>','palette');
  resultats();
}
function resultats(){
  const q = ($('#k-q')?.value || '').toLowerCase();
  const tout = [...ACTIFS.map(a => ({a:'sym',v:a.s,l:`${a.s} · ${a.nom}`,d:a.cl})),...Object.entries(PAGES).map(([k,p]) => ({a:'aller',v:k,l:p.nom,d:'Page'}))].filter(x => x.l.toLowerCase().includes(q));
  choixPalette = Math.max(0,Math.min(choixPalette,tout.length - 1));
  peindre('k-r',tout.map((x,i) => `<button class="${i === choixPalette ? 'sel' : ''}" data-a="${x.a}" data-v="${x.v}"><span>${esc(x.l)}</span><small class="dim">${x.d}</small></button>`).join('') || '<p class="vide">Aucun résultat. Essayez AAPL ou Portefeuille.</p>');
  $('#k-r .sel')?.scrollIntoView({block:'nearest'});
}

/* ---------- actions ---------- */
function quantiteParDefaut(){
  const i = document.getElementById('t-q'); if (!i) return;
  const p = prix(U.sym);
  i.value = U.sens === 'vente' ? fQ(Math.max(0,vendable(U.sym))).replace(/\s/g,'') : p > 2000 ? '0,1' : p > 500 ? '1' : '10';
  document.getElementById('t-n').value = (U.type === 'stop' ? p * (U.sens === 'achat' ? 1.03 : .97) : p * (U.sens === 'achat' ? .98 : 1.02)).toFixed(2).replace('.',',');
}
const A = {
  fermer, chercher, info:expliquer,
  aller(v){ fermer(); location.hash = v; },
  sym(s){
    fermer(); U.sym = s; U.classe = PAR_S[s].cl; U.vue = 'graphe';
    if (U.page !== 'marche') location.hash = 'marche'; else { quantiteParDefaut(); maj(); }
  },
  ref(v){ U.ref = v; $('#d-ref').value = v; maj(); },
  plus(){ ouvrir(`<h2>Tous les modules</h2><div class="plus-l">${ORDRE_NAV.map(k => `<a href="#${k}" data-a="fermer">${ico(PAGES[k].icone)}<span>${PAGES[k].nom}</span></a>`).join('')}<a href="#marque" data-a="fermer">${ico('marque')}<span>Identité</span></a></div>`); },
  regime(v){
    fermer();
    const oui = v === 'direct';
    if (oui === S.direct) return;
    basculerDirect(oui); monter();
    annoncer(oui ? 'Direct simulé, compte séparé. Votre rejeu est mis de côté.' : 'Retour au rejeu, là où vous étiez.');
  },
  dates:() => dialogueDates(),
  dRapide(v){ $('#d-cible').value = v; effetDate(); },
  dAller(){
    const d = $('#d-cible').value; if (!d || d < DATE_MIN || d > AUJOURDHUI) return;
    const n = indexDate(d) - S.t; if (n <= 0) return;
    fermer();
    let nb = 0;
    for (let i = 0; i < n; i++) nb += seanceSuivante().length;
    monter(); annoncer(`Nous sommes le ${dl(S.t)}.${nb ? ` ${nb} événement(s) sur vos ordres et contrats.` : ''}`);
  },
  dDemarrer(){
    const d = $('#d-cible').value; if (!d || d < DATE_MIN || d > AUJOURDHUI) return effetDate();
    fermer(); initialiser(indexDate(d < '2019-01-02' ? '2019-01-02' : d)); F_ETAT.defi = null;
    monter(); annoncer(`Nouvelle simulation au ${dl(S.t)}.`);
  },
  vue(v){ U.vue = v; maj(); },
  dashPer(v){ U.dashPer = +v; maj(); },
  pPer(v){ U.pPer = +v; maj(); },
  pChoix(v){ U.pChoix = v; maj(); },
  journal(v){ U.journal = v; maj(); },
  blot(v){ U.blot = v; maj(); },
  tri(v){ U.triSens = U.tri === v ? -U.triSens : -1; U.tri = v; maj(); },
  gType(v){ U.g.type = v; maj(); },
  gN(v){ U.g.n = +v; maj(); },
  ind(v){ U.g[v] = !U.g[v]; maj(); },
  sens(v){ U.sens = v; quantiteParDefaut(); ticket(); },
  type(v){ U.type = v; quantiteParDefaut(); ticket(); },
  book(v){
    U.type = 'limite'; U.vue = 'ordre';
    $('#t-n').value = Number(v).toFixed(2).replace('.',',');
    maj();
  },
  pct(v){
    const s = U.sym, pas = prix(s) > 500 ? 10000 : 1;
    let q;
    if (U.sens === 'achat') {
      const n = U.type === 'marche' ? ask(s) : lire('t-n');
      q = Math.floor(disponible() * (v / 100) * .9995 / (n * (1 + tauxFrais(s))) * pas) / pas;
    } else q = +v === 100 ? vendable(s) : Math.floor(vendable(s) * (v / 100) * pas) / pas;
    $('#t-q').value = Number.isFinite(q) ? String(q).replace('.',',') : '';
    ticket();
  },
  revoir(){ const d = brouillon(); if (!d.err) confirmer(d); },
  cloturer(s){
    const q = vendable(s);
    if (!(q > 0)) return annoncer('Toute la position est réservée par un ordre. Annulez-le d’abord.',true);
    const ref = bid(s), f = q * ref * tauxFrais(s);
    confirmer({s,sens:'vente',type:'marche',q,ref,niveau:null,f,total:q * ref - f});
  },
  valider(){
    const d = enAttente; fermer(); if (!d) return;
    const r = placer(d);
    if (r.erreur) annoncer(r.erreur,true);
    else {
      const o = r.ordre, fait = o.statut === 'Exécuté';
      annoncer(fait ? `${d.sens === 'achat' ? 'Achat' : 'Vente'} exécuté : ${fQ(d.q)} ${d.s} à ${fPx(S.execs[0].px)} USD.` : `Ordre ${d.s} placé, en attente à ${fPx(o.niveau)} USD.`);
      U.blot = fait ? 'Positions' : 'Ordres';
    }
    maj();
  },
  annuler(id){ const o = S.ordres.find(x => x.id === +id); if (o) o.statut = 'Annulé'; annoncer('Ordre annulé.'); maj(); },
  lecture(){ minuterie ? pause() : lecture(); },
  pas(v){ avancer(+v); },
  vitesse(v){ vitesse = +v; minuterie ? lecture() : majCoquille(); },
  mode(v){ mode = v; document.body.classList.toggle('trader',v === 'trader'); maj(); },
  reset(){ pause(); ouvrir('<h2>Recommencer la séance ?</h2><p class="d2">Vos ordres de démonstration seront effacés et la date initiale sera restaurée.</p><div class="acts"><button class="btn" data-a="fermer">Annuler</button><button class="btn p" data-a="resetOui">Recommencer</button></div>'); },
  resetOui(){ fermer(); if (S.direct) basculerDirect(false); initialiser(); F_ETAT.defi = null; monter(); annoncer('Séance réinitialisée.'); },
  aTab(v){ U.aTab = v; monter(); },
  sTab(v){ suspendreJeu(); U.sTab = v; monter(); },
  strat(v){ U.strats.has(v) ? U.strats.delete(v) : U.strats.add(v); maj(); },
  choc(v){ U.choc = v; U.v = {...CHOCS.find(c => c.id === v).v}; monter(); },
  ancre(v){ document.getElementById(v).scrollIntoView(); },
  async copier(v){
    try { await navigator.clipboard.writeText(v); annoncer(`${v} copié.`); }
    catch { annoncer(`Code couleur : ${v}`); }
  }
};
Object.assign(A,ACTIONS_JEU,ACTIONS_STRESS,ACTIONS_FORMATION,ACTIONS_ACTUARIAT,ACTIONS_XAI);

document.addEventListener('click',e => {
  if (e.target.hasAttribute('data-fond')) return fermer();
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  if (b.dataset.a === 'ancre') e.preventDefault();
  A[b.dataset.a]?.(b.dataset.v);
});
document.addEventListener('input',e => {
  const id = e.target.id, v = e.target.value;
  const regler = () => { const o = document.getElementById('o-' + id); if (o) o.textContent = propre(v.replace('.',',')) + e.target.dataset.u; };
  if (id === 'w-classe') {
    U.classe = v;
    U.sym = ACTIFS.find(a => a.cl === v).s;
    quantiteParDefaut(); maj();
  }
  else if (id === 'd-ref') { U.ref = v; maj(); }
  else if (id === 'd-cible') effetDate();
  else if (id === 'se-txt') { U.phrase = v; testerPhrase(); }
  else if (id === 'st-sel') { U.banque = +v; maj(); }
  else if (id.startsWith('st-')) { U.macro[id.slice(3)] = +v; U.scenB = ''; regler(); maj(); }
  else if (id.startsWith('af-')) { U.af[id.slice(3)] = +v; regler(); maj(); }
  else if (id.startsWith('as-')) { U.assur[id.slice(3)] = +v; regler(); maj(); }
  else if (id === 'k-q') { choixPalette = 0; resultats(); }
  else if (id.startsWith('t-')) ticket();
  else if (id === 'a-sym') { U.aSym = v; maj(); }
  else if (id.startsWith('i-')) {
    const k = id.slice(2);
    let u = '';
    if (k[0] === 'c') { U.v[Object.keys(U.v)[+k.slice(1)]] = +v; U.choc = ''; u = ' %'; }
    else { U[k] = +v; u = {rap:' j',lent:' j',d:' pts',lgd:' %',titres:' %'}[k]; }
    document.getElementById('o-' + k).textContent = propre(v) + u;
    maj();
  }
});
document.addEventListener('submit',e => {
  e.preventDefault();
  if (e.target.dataset.form !== 'chat') return;
  const i = e.target.querySelector('input'), q = i.value;
  i.value = ''; demander(q); i.focus();
});
document.addEventListener('keydown',e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (U.page !== 'marque' && !$('#couche').firstChild) chercher();
    return;
  }
  if (!$('#couche').firstChild) {
    if (e.key === 'Escape' && U.chat) A.chat();
    return;
  }
  if (e.key === 'Escape') fermer();
  else if (document.getElementById('k-r') && ['ArrowDown','ArrowUp','Enter'].includes(e.key)) {
    e.preventDefault();
    if (e.key === 'Enter') $('#k-r .sel')?.click(); else { choixPalette += e.key === 'ArrowDown' ? 1 : -1; resultats(); }
  } else if (e.key === 'Tab') {
    const f = [...$('#couche').querySelectorAll('button:not(:disabled),input,a[href]')], i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});

function controleNav(){
  const manque = ORDRE_NAV.filter(k => !PAGES[k]);
  if (manque.length) throw new Error('Pages absentes : ' + manque);
}
let redim;
addEventListener('resize',() => { clearTimeout(redim); redim = setTimeout(maj,100); });
addEventListener('hashchange',route);

initialiser();
controleNav();
$('#marque').innerHTML = pageMarque();
$('#app').innerHTML = coquille();
route();
document.fonts?.ready.then(maj);

</script>
